<!doctype html>
<meta charset="utf-8">
<title>Whisper spike — does on-device transcription hold up?</title>
<!--
  A SPIKE, not a feature — see spike/RESULTS.md for the verdict and the numbers.
  Its job is to turn July's #139 estimates into measurements, and it is kept rather than
  deleted because the interesting question is hardware-dependent and this is how you
  re-ask it: `?device=webgpu|wasm` and `?dtype=fp32|q4|q8`.

  On the dev server it runs under the REAL isolation CrossTab runs under
  (`Cross-Origin-Opener-Policy: same-origin`, `Cross-Origin-Embedder-Policy:
  credentialless`), which is what makes the desktop numbers trustworthy. On GitHub Pages
  there are no such headers — isolation comes from the service worker — so the page
  reports `crossOriginIsolated` first. Read that line before the timings: without
  isolation there is no SharedArrayBuffer, WASM runs single-threaded, and the figure is a
  floor rather than the real fallback speed.

  What it measures, because these are the numbers the decision needs:
    1. Is WebGPU actually available here, or do we fall back to WASM?
    2. How long does the model take to arrive, and how big is it really?
    3. How long to transcribe a short clip, and a ~60-second one?
    4. What is the real-time factor — the figure that decides whether an hour of
       interview audio is a coffee break or an afternoon.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.2rem; }
  button { font: inherit; padding: .5rem 1rem; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px;
         background: #f6f8fa; border: 1px solid #d0d7de; padding: 1rem; margin-top: 1rem; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; } .dim { color: #656d76; }
</style>

<h1>Whisper spike</h1>
<p>Measures what July's feasibility note estimated: model size, load time, and real-time
   factor, under CrossTab's own cross-origin isolation.</p>
<button id="run">Run the spike</button>
<div id="log">idle</div>

<script type="module">
const logEl = document.getElementById('log');
const lines = [];
const log = (s, cls = '') => {
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  logEl.innerHTML = lines.join('\n');
};
const ms = (n) => `${Math.round(n)} ms`;
const mb = (n) => `${(n / 1048576).toFixed(1)} MB`;

document.getElementById('run').addEventListener('click', async () => {
  lines.length = 0;
  log('--- environment ---');
  log(`crossOriginIsolated: ${crossOriginIsolated}`);
  log(`hardwareConcurrency: ${navigator.hardwareConcurrency}`);
  const hasWebGPU = 'gpu' in navigator;
  let adapter = null;
  if (hasWebGPU) {
    try { adapter = await navigator.gpu.requestAdapter(); } catch { /* reported below */ }
  }
  log(`WebGPU: ${hasWebGPU ? (adapter ? 'available' : 'navigator.gpu present but no adapter') : 'absent'}`,
      adapter ? 'ok' : 'bad');

  // Count the bytes the model actually costs, by wrapping fetch. The published figure is
  // a compressed artefact list; what matters is what crosses the wire here.
  let bytes = 0;
  const realFetch = window.fetch;
  window.fetch = async (...args) => {
    const res = await realFetch(...args);
    const len = Number(res.headers.get('content-length')) || 0;
    bytes += len;
    const url = String(args[0]?.url ?? args[0]);
    if (len > 100000) log(`  fetched ${mb(len)}  ${url.split('/').slice(-1)[0]}`, 'dim');
    return res;
  };

  try {
    log('\n--- loading transformers.js ---');
    let t = performance.now();
    // Pinned, like every other runtime this project pulls from a CDN.
    const lib = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1');
    log(`import: ${ms(performance.now() - t)}`, 'ok');

    log('\n--- building the pipeline (downloads the model) ---');
    // Both halves are a decision input: the device decides SPEED, the dtype decides
    // DOWNLOAD. fp32 on WebGPU measured 149.8 MB, which is twice what July's note quoted
    // for "tiny", so the quantised variant is worth its own measurement.
    const q = new URLSearchParams(location.search);
    const device = q.get('device') || (adapter ? 'webgpu' : 'wasm');
    const dtype = q.get('dtype') || (device === 'webgpu' ? 'fp32' : 'q8');
    log(`device: ${device} · dtype: ${dtype}`);
    t = performance.now();
    const asr = await lib.pipeline('automatic-speech-recognition', 'onnx-community/whisper-tiny.en', {
      device,
      dtype,
      progress_callback: (p) => { if (p.status === 'progress' && p.progress === 100) log(`  ready: ${p.file}`, 'dim'); },
    });
    const loadMs = performance.now() - t;
    log(`pipeline ready: ${ms(loadMs)}  |  bytes over the wire: ${mb(bytes)}`, 'ok');

    log('\n--- audio ---');
    // The standard transformers.js sample: public-domain JFK speech, ~11 s.
    t = performance.now();
    const wav = await (await fetch('https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav')).arrayBuffer();
    const ctx = new AudioContext({ sampleRate: 16000 });
    const decoded = await ctx.decodeAudioData(wav.slice(0));
    const one = decoded.getChannelData(0);
    log(`clip: ${(one.length / 16000).toFixed(1)} s, decoded in ${ms(performance.now() - t)}`);

    // A ~60 s workload, by repeating the same speech. Not a transcription-quality test —
    // it is a TIMING test, and real speech is the right load for that.
    const reps = Math.ceil(60 / (one.length / 16000));
    const long = new Float32Array(one.length * reps);
    for (let i = 0; i < reps; i++) long.set(one, i * one.length);
    log(`long clip: ${(long.length / 16000).toFixed(1)} s (${reps}x the sample)`);

    for (const [label, audio] of [['short', one], ['~60 s', long]]) {
      const secs = audio.length / 16000;
      t = performance.now();
      const out = await asr(audio, { chunk_length_s: 30, stride_length_s: 5 });
      const took = performance.now() - t;
      log(`\n${label}: ${ms(took)} for ${secs.toFixed(1)} s audio`);
      log(`  real-time factor: ${(secs / (took / 1000)).toFixed(1)}x`, 'ok');
      if (label === 'short') log(`  text: ${JSON.stringify(String(out.text).slice(0, 120))}`, 'dim');
    }

    // ---------------------------------------------------------------------------
    // Diarization: who spoke, and when. A separate model from Whisper.
    // ---------------------------------------------------------------------------
    if (q.get('diarize') !== 'no') {
      log('\n--- speaker diarization ---');
      try {
        const before = bytes;
        t = performance.now();
        const segModel = 'onnx-community/pyannote-segmentation-3.0';
        const [proc, seg] = await Promise.all([
          lib.AutoProcessor.from_pretrained(segModel),
          lib.AutoModelForAudioFrameClassification.from_pretrained(segModel, { dtype: 'q8' }),
        ]);
        log(`segmentation model ready: ${ms(performance.now() - t)} · ${mb(bytes - before)}`, 'ok');

        // A real two-speaker conversation with known ground truth: JFK, MLK, JFK.
        // Three turns, two speakers — a correct answer is A, B, A.
        const mlkBuf = await (await fetch('https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/mlk.wav')).arrayBuffer();
        const mlk = (await ctx.decodeAudioData(mlkBuf.slice(0))).getChannelData(0);
        const convo = new Float32Array(one.length * 2 + mlk.length);
        convo.set(one, 0);
        convo.set(mlk, one.length);
        convo.set(one, one.length + mlk.length);
        log(`conversation: ${(convo.length / 16000).toFixed(1)} s — JFK ${(one.length / 16000).toFixed(1)}s, MLK ${(mlk.length / 16000).toFixed(1)}s, JFK again`);

        t = performance.now();
        const inputs = await proc(convo);
        const { logits } = await seg(inputs);
        const turns = proc.post_process_speaker_diarization(logits, convo.length)[0];
        const took = performance.now() - t;
        log(`diarized in ${ms(took)} — ${(convo.length / 16000 / (took / 1000)).toFixed(1)}x real time`, 'ok');

        // Merge adjacent same-speaker turns; raw output is frame-level and chatty.
        const merged = [];
        for (const seg1 of turns) {
          const last = merged[merged.length - 1];
          if (last && last.id === seg1.id && seg1.start - last.end < 0.5) last.end = seg1.end;
          else merged.push({ id: seg1.id, start: seg1.start, end: seg1.end });
        }
        log(`turns: ${merged.length} (raw frames: ${turns.length})`);
        for (const m of merged.slice(0, 8)) {
          log(`  Speaker ${m.id}: ${m.start.toFixed(1)}s – ${m.end.toFixed(1)}s`, 'dim');
        }
        const ids = [...new Set(merged.map((m) => m.id))];
        const pattern = merged.map((m) => String.fromCharCode(65 + ids.indexOf(m.id))).join(',');
        log(`speakers found: ${ids.length} · pattern: ${pattern}`, ids.length === 2 ? 'ok' : 'bad');
        log(`  ground truth is 2 speakers, pattern A,B,A`, 'dim');
        // ---------------------------------------------------------------------
        // The segmentation model answers "is someone speaking", not "who". Identity
        // needs embeddings: slice, embed, cluster by cosine distance, merge.
        // ---------------------------------------------------------------------
        log('\n  --- with speaker embeddings ---');
        const beforeEmb = bytes;
        t = performance.now();
        const embId = 'onnx-community/wespeaker-voxceleb-resnet34-LM';
        const [embProc, embModel] = await Promise.all([
          lib.AutoProcessor.from_pretrained(embId),
          lib.AutoModel.from_pretrained(embId, { dtype: 'q8' }),
        ]);
        log(`  embedding model ready: ${ms(performance.now() - t)} · ${mb(bytes - beforeEmb)}`, 'ok');

        const WIN = 2.0; // seconds — long enough for a stable voice print, short enough to find a turn
        const SR = 16000;
        const vecs = [];
        t = performance.now();
        for (let i = 0; i + WIN * SR <= convo.length; i += WIN * SR) {
          const slice = convo.subarray(i, i + WIN * SR);
          const out = await embModel(await embProc(slice));
          if (!vecs.length) log(`  model output keys: ${Object.keys(out).join(', ')}`, 'dim');
          const tensor = out.embeddings ?? out.logits ?? Object.values(out)[0];
          vecs.push({ at: i / SR, v: Array.from(tensor.data) });
        }
        log(`  embedded ${vecs.length} x ${WIN}s windows in ${ms(performance.now() - t)} (dim ${vecs[0].v.length})`);

        const cos = (a, b) => {
          let d = 0, na = 0, nb = 0;
          for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
          return d / (Math.sqrt(na) * Math.sqrt(nb) || 1);
        };

        // Agglomerative: each window joins the nearest existing speaker if close enough,
        // otherwise starts a new one. The number of speakers is what we do not know — which
        // is why the THRESHOLD is the whole game, so it is swept rather than guessed. The
        // embeddings are computed once; only the clustering repeats.
        const cluster = (thresh) => {
          const speakers = [];
          const assigned = [];
          for (const w of vecs) {
            let best = -1, bestSim = -2;
            speakers.forEach((sp, i) => {
              const sim = cos(w.v, sp.centroid);
              if (sim > bestSim) { bestSim = sim; best = i; }
            });
            if (best >= 0 && bestSim >= thresh) {
              const sp = speakers[best];
              sp.centroid = sp.centroid.map((c, i) => (c * sp.n + w.v[i]) / (sp.n + 1));
              sp.n += 1;
              assigned.push(best);
            } else {
              speakers.push({ centroid: [...w.v], n: 1 });
              assigned.push(speakers.length - 1);
            }
          }
          const turns = [];
          vecs.forEach((w, i) => {
            const last = turns[turns.length - 1];
            if (last && last.sp === assigned[i]) last.end = w.at + WIN;
            else turns.push({ sp: assigned[i], start: w.at, end: w.at + WIN });
          });
          return { n: speakers.length, turns };
        };

        for (const th of [0.25, 0.35, 0.45, 0.55, 0.65]) {
          const { n, turns } = cluster(th);
          const shape = turns.map((t2) => String.fromCharCode(65 + t2.sp)).join(',');
          log(`  thresh ${th}: ${n} speakers, ${turns.length} turns — ${shape}`,
              n === 2 && turns.length === 3 ? 'ok' : '');
          if (n === 2 && turns.length === 3) {
            for (const t2 of turns) {
              log(`      Speaker ${String.fromCharCode(65 + t2.sp)}: ${t2.start.toFixed(1)}s – ${t2.end.toFixed(1)}s`, 'dim');
            }
          }
        }
        log(`    ground truth: A 0–11s, B 11–24s, A 24–35s`, 'dim');
      } catch (err) {
        log(`diarization FAILED: ${err?.message ?? err}`, 'bad');
        log(String(err?.stack ?? '').split('\n').slice(0, 4).join('\n'), 'dim');
      }
    }

    log('\n--- verdict inputs ---');
    log(`device ${device} · model bytes ${mb(bytes)} · load ${ms(loadMs)}`);
    log('An hour of interview audio at the factor above:');
    log('  (3600 / factor) seconds of grinding — compare against "a coffee break".');
  } catch (err) {
    log(`\nFAILED: ${err?.message ?? err}`, 'bad');
    log(String(err?.stack ?? '').split('\n').slice(0, 6).join('\n'), 'dim');
  } finally {
    window.fetch = realFetch;
  }
});
</script>
