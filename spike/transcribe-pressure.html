<!doctype html>
<meta charset="utf-8">
<title>Transcription pressure — what does a worker actually cost?</title>
<!--
  A SPIKE. Companion to whisper-spike.html; verdict goes in spike/RESULTS.md.

  I claimed in a commit message that "two models and an hour of audio in parallel is how a
  phone runs out of memory". I had not measured that, and the owner called it: we do not
  know it, batch transcription of several interviews is a likely need, and one weak device
  should not set the ceiling for every device.

  So this measures the thing the claim was about:

    1. What memory does ONE transcription worker cost, with the model loaded?
    2. Does that scale linearly with more workers, or do they share something?
    3. Does running N at once actually FINISH faster, or do they just contend?
    4. What does a device actually tell us about its limits — `deviceMemory`,
       `measureUserAgentSpecificMemory`, `jsHeapSizeLimit` — and which of those exist on
       a phone rather than a desktop?

  Question 3 is the one the allocation policy rests on and the one the first two runs
  could not answer, because loading a model says what workers COST and nothing about what
  they BUY. It needs no memory API, only a stopwatch, so it answers on iOS too.

  Question 4 matters most for the design: `measureUserAgentSpecificMemory` requires
  cross-origin isolation and `deviceMemory` is Chromium-only, so on iOS the honest answer
  may be "you cannot read memory at all", and the pool has to adapt by watching jobs
  succeed or die instead of by reading a gauge.

  Run with ?n=4 to change how many workers it spins up.
-->
<!--
  Register the service worker the way index.html does. GitHub Pages sends no COOP/COEP, so
  isolation comes from this worker injecting them into the navigations it controls — and a
  page that does not register it only gets isolated if the app happened to install it
  first. That is a dependency on what the user did earlier, which is not a property a
  measurement should have: the owner reloaded a phone repeatedly and stayed un-isolated,
  because nothing on this page was registering anything.

  The script self-registers and handles the reload-to-isolate dance, with a session flag
  so a context that genuinely cannot isolate reloads once and then stops. Its scope comes
  from ITS path (/crosstab/), which covers /crosstab/spike/.
-->
<script src="../sw.js"></script>

<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.2rem; }
  button { font: inherit; padding: .5rem 1rem; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px;
         background: #f6f8fa; border: 1px solid #d0d7de; padding: 1rem; margin-top: 1rem; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; } .dim { color: #656d76; }
</style>

<h1>Transcription pressure</h1>
<p>What one transcription worker costs, whether N of them cost N times that, whether
   running N at once actually finishes faster, and what this device will admit about its
   own limits.</p>
<button id="run">Measure</button>
<div id="log">idle</div>

<script type="module">
const logEl = document.getElementById('log');
const lines = [];
const log = (s, cls = '') => {
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  logEl.innerHTML = lines.join('\n');
};
const mb = (n) => `${(n / 1048576).toFixed(1)} MB`;

/** Total agent memory, or null where the browser will not say. */
async function measure() {
  if (typeof performance.measureUserAgentSpecificMemory !== 'function') return null;
  try {
    const m = await performance.measureUserAgentSpecificMemory();
    return m.bytes;
  } catch { return null; }
}

document.getElementById('run').addEventListener('click', async () => {
  lines.length = 0;
  const q = new URLSearchParams(location.search);
  const N = Number(q.get('n') || 4);

  log('--- what this device will tell us ---');
  log(`crossOriginIsolated:            ${crossOriginIsolated}`);
  log(`hardwareConcurrency:            ${navigator.hardwareConcurrency ?? 'ABSENT'}`);
  log(`navigator.deviceMemory:         ${navigator.deviceMemory ?? 'ABSENT (not Chromium)'}`,
      navigator.deviceMemory ? '' : 'bad');
  log(`measureUserAgentSpecificMemory: ${typeof performance.measureUserAgentSpecificMemory === 'function' ? 'present' : 'ABSENT'}`,
      typeof performance.measureUserAgentSpecificMemory === 'function' ? '' : 'bad');
  log(`performance.memory.jsHeapSizeLimit: ${performance.memory ? mb(performance.memory.jsHeapSizeLimit) : 'ABSENT'}`,
      performance.memory ? '' : 'bad');
  log('\n  An ABSENT above is the point: the pool cannot depend on reading a gauge that', 'dim');
  log('  half the devices do not have. It has to adapt by watching jobs instead.', 'dim');

  log(`service worker controlling: ${navigator.serviceWorker?.controller ? 'yes' : 'NO'}`,
      navigator.serviceWorker?.controller ? '' : 'bad');
  if (!crossOriginIsolated) {
    log('\n  NOT ISOLATED — reload before trusting anything below.', 'bad');
    log('  These spike pages do not register the service worker themselves. They inherit', 'dim');
    log('  isolation from the one the app installs, and GitHub Pages sends no COOP/COEP of', 'dim');
    log('  its own. A fresh deploy REPLACES that worker, and a navigation while the new one', 'dim');
    log('  is installing is uncontrolled — so nothing injects the headers. Reload once it', 'dim');
    log('  has activated. If it stays NO, open the app itself once, then come back.', 'dim');
    log('  Un-isolated costs two things: no SharedArrayBuffer, so WASM is single-threaded', 'dim');
    log('  and every timing is a floor; and no measureUserAgentSpecificMemory, so the', 'dim');
    log('  memory figures read "unmeasurable".', 'dim');
  }

  // A real same-origin file, like the production worker. The blob version of this hung
  // with no error, which is a question about blob module workers, not about memory.
  const url = new URL('./transcribe-pressure-worker.js', import.meta.url);
  const workers = [];
  const base = await measure();
  log(`\n--- spinning up ${N} workers, each loading whisper-tiny q8 ---`);
  log(`baseline: ${base === null ? 'unmeasurable' : mb(base)}`);

  let prev = base;
  for (let i = 1; i <= N; i++) {
    const w = new Worker(url, { type: 'module' });
    workers.push(w);
    const t = performance.now();
    const ok = await new Promise((resolve) => {
      w.onmessage = (e) => resolve(e.data?.type === 'ready' ? true : e.data?.message || false);
      w.onerror = (e) => resolve(e.message || 'worker failed to load');
      // Say something rather than hanging silently, which is how the first draft failed.
      setTimeout(() => resolve('timed out after 120 s'), 120000);
      w.postMessage({ type: 'load' });
    });
    const took = Math.round(performance.now() - t);
    if (ok !== true) { log(`worker ${i}: FAILED after ${took} ms — ${ok}`, 'bad'); break; }

    const now = await measure();
    const delta = now !== null && prev !== null ? now - prev : null;
    log(`worker ${i}: ready in ${took} ms` + (delta !== null
      ? ` · total ${mb(now)} · this worker +${mb(delta)}`
      : ' · memory unmeasurable here'), 'ok');
    prev = now;
  }

  if (base !== null && prev !== null && workers.length) {
    const per = (prev - base) / workers.length;
    log(`\naverage per worker: ${mb(per)} across ${workers.length}`, 'ok');
    if (navigator.deviceMemory) {
      log(`device claims ${navigator.deviceMemory} GB — that is ${Math.floor((navigator.deviceMemory * 1073741824 * 0.25) / per)} workers at a 25% budget`, 'dim');
    }
  }

  // ===================================================================================
  // Does concurrency actually HELP? — the question the allocation policy rests on
  // ===================================================================================
  //
  // Everything above only LOADS models, which says what N workers COST but nothing about
  // what they BUY. ORT already runs threads inside each worker, so on a 4-core phone two
  // workers may halve the wall clock, or may contend and halve nothing. Policy without
  // this number is guesswork.
  //
  // No memory API involved: it is a stopwatch, so it works on iOS, which is exactly the
  // platform that will never report memory.
  if (workers.length >= 2) {
    const SECONDS = 60;
    const JOBS = workers.length * 2;

    // Synthetic audio, so the measurement needs no file and every device runs the exact
    // same input. The content is nonsense and the transcript is garbage — that is fine,
    // because WHISPER'S COST BARELY DEPENDS ON CONTENT: a fixed encoder pass per 30 s
    // window plus a capped decoder. What matters is that the serial and parallel passes
    // are handed identical work.
    const synth = (seconds) => {
      const sr = 16000;
      const a = new Float32Array(sr * seconds);
      let s = 1234567;                     // fixed seed: same waveform on every device
      let y = 0;
      for (let i = 0; i < a.length; i++) {
        s = (s * 1103515245 + 12345) & 0x7fffffff;
        y = 0.97 * y + 0.03 * ((s / 0x7fffffff) * 2 - 1);   // lightly smoothed, speech-ish
        a[i] = Math.max(-1, Math.min(1, y * 6));
      }
      return a;
    };
    const audio = synth(SECONDS);
    const once = (w) => new Promise((resolve) => {
      w.onmessage = (ev) => resolve(ev.data?.type === 'done' ? ev.data : { ms: null, err: ev.data?.message });
      w.onerror = (ev) => resolve({ ms: null, err: ev.message || 'worker died' });
      setTimeout(() => resolve({ ms: null, err: 'timed out after 180 s' }), 180000);
      w.postMessage({ type: 'run', audio, maxTokens: 48 });
    });

    log(`\n--- throughput: ${JOBS} clips of ${SECONDS} s, serial vs ${workers.length}-way ---`);
    log('Synthetic audio. The transcript is nonsense; the TIMING is the measurement.', 'dim');

    const t1 = performance.now();
    let failed = null;
    for (let i = 0; i < JOBS && !failed; i++) {
      const r = await once(workers[0]);
      if (r.ms === null) failed = r.err;
    }
    const serial = Math.round(performance.now() - t1);
    if (failed) {
      log(`serial pass FAILED — ${failed}`, 'bad');
    } else {
      log(`serial (1 worker):  ${serial} ms  ·  ${(JOBS * SECONDS * 1000 / serial).toFixed(1)}x real time`, 'ok');

      // Round-robin the same jobs across every worker, all in flight at once.
      const t2 = performance.now();
      const results = await Promise.all(workers.map(async (w) => {
        for (let i = 0; i < JOBS / workers.length; i++) {
          const r = await once(w);
          if (r.ms === null) return r.err;
        }
        return null;
      }));
      const par = Math.round(performance.now() - t2);
      const died = results.find(Boolean);
      if (died) {
        log(`parallel pass FAILED — ${died}`, 'bad');
        log('A worker dying HERE is the finding: the device cannot sustain this many.', 'dim');
      } else {
        const speedup = serial / par;
        log(`parallel (${workers.length} workers): ${par} ms  ·  ${(JOBS * SECONDS * 1000 / par).toFixed(1)}x real time`, 'ok');
        log(`\nspeed-up: ${speedup.toFixed(2)}x from ${workers.length} workers`,
            speedup > 1.15 ? 'ok' : 'bad');
        log(speedup > 1.15
          ? '  Concurrency pays here, so the pool is worth having on this device.'
          : '  Concurrency does NOT pay here — the cores were already busy inside one',
          'dim');
        if (speedup <= 1.15) {
          log('  worker, so a second one only adds memory. On a device like this the right', 'dim');
          log('  limit is 1 no matter how much memory it has, which is an argument for', 'dim');
          log('  measuring throughput once rather than dividing cores by two.', 'dim');
        }
      }
    }
  } else {
    log('\n(throughput comparison needs at least 2 workers — try ?n=2)', 'dim');
  }

  log('\n--- tearing down ---');
  for (const w of workers) w.terminate();
  await new Promise((r) => setTimeout(r, 1500));
  const after = await measure();
  log(after === null ? 'post-teardown: unmeasurable' : `post-teardown: ${mb(after)}`
    + (base !== null ? ` (baseline was ${mb(base)})` : ''));
  log('A number well above the baseline means terminate() does not promptly return it,', 'dim');
  log('which is a reason to reuse a pool rather than spawn per job.', 'dim');
});
</script>
