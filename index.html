<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CrossTab</title>
    <meta name="theme-color" content="#2c3e50" />
    <link rel="manifest" href="manifest.json" />
    <!-- iOS uses apple-touch-icon (not the manifest) for the Home Screen icon. -->
    <link rel="apple-touch-icon" href="vendor/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="vendor/icon-192.png" />

    <!--
      Cross-Origin-Isolation shim. MUST run before anything that needs
      SharedArrayBuffer (i.e. before WebR loads). On hosts that already send
      COOP/COEP headers (Cloudflare Pages) this is a no-op. See sw.js.
      Loaded as a classic script on purpose: it inspects document.currentScript.
    -->
    <script src="sw.js"></script>

    <style>
      :root {
        --bar: #2c3e50;
        --bar-fg: #ecf0f1;
        --accent: #2572a5;
        --line: #d8dde2;
        --bg: #f7f8fa;
        --panel: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1a1a1a;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        /* Never let content (e.g. a full menubar) scroll the whole page sideways;
           inner panes keep their own scrollbars. */
        overflow-x: hidden;
        /* Respect iPad safe areas in standalone PWA mode. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* --- header + menubar --- */
      header {
        background: var(--bar);
        color: var(--bar-fg);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 12px;
        min-height: 44px; /* comfortable touch target on iPad */
        flex-wrap: wrap; /* so the small-screen note can take a line of its own */
      }
      /* A real <button>, not a wordmark: this is the only route back to the launcher.
         Reset the UA button chrome so it still reads as the brand. */
      .brand {
        font: inherit; font-weight: 700; letter-spacing: .04em;
        background: none; border: 0; padding: 2px 4px; margin: 0 -4px;
        color: inherit; cursor: pointer; border-radius: 4px;
      }
      .brand:hover { background: rgba(255, 255, 255, .1); }
      /* Global focus indicator. The app had 8 :focus rules in total and several places
         that removed the outline outright, so keyboard users had little to follow.
         2px at 3:1+ against both surfaces satisfies WCAG 2.4.11 focus appearance. */
      :focus-visible { outline: 2px solid #1b6ea8; outline-offset: 2px; }
      header :focus-visible, .ctl__bar :focus-visible { outline-color: #66aedd; }
      /* Wrap to additional rows when there are many menus, rather than overflowing
         the header (which used to scroll the whole window sideways). min-width:0
         lets it shrink within the header flex row. */
      nav.menubar { display: flex; flex-wrap: wrap; gap: 2px; position: relative; flex: 1 1 auto; min-width: 0; }
      .menu { position: relative; }
      .menu__button {
        background: transparent; color: var(--bar-fg); border: 0;
        font: inherit; padding: 10px 12px; cursor: pointer; border-radius: 4px;
      }
      .menu__button:hover, .menu__button[aria-expanded="true"] { background: rgba(255,255,255,.15); }
      .menu__panel {
        position: absolute; top: 100%; left: 0; z-index: 50;
        background: var(--panel); color: #1a1a1a; min-width: 240px;
        border: 1px solid var(--line); border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px;
        /* A long menu (e.g. Regression) scrolls within itself instead of growing
           the page and scrolling the whole window. */
        max-height: calc(100vh - 52px); overflow-y: auto;
      }
      .menu__item {
        display: block; width: 100%; text-align: left; background: transparent;
        border: 0; font: inherit; padding: 9px 12px; border-radius: 4px; cursor: pointer;
      }
      .menu__item:hover { background: #eef5fb; }
      .menu__group { padding: 4px 0; }
      .menu__group-label {
        font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
        color: #646e77; padding: 6px 12px 2px;
      }

      /* The one-line note shown when the VIEWPORT turned small-screen mode on. Said once,
         dismissible, and it carries the way out rather than just announcing itself. */
      .screennote {
        flex: 1 0 100%; margin: 0 -12px; /* a full-bleed strip under the bar */
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        background: #1f3243; color: var(--bar-fg); font-size: 12.5px;
        padding: 6px 10px; border-top: 1px solid rgba(255,255,255,.14);
      }
      .screennote__btn {
        font: inherit; font-size: 12.5px; background: none; color: #9fd0f0;
        border: 1px solid rgba(159,208,240,.5); border-radius: 6px; padding: 2px 8px; cursor: pointer;
      }
      .screennote__btn:hover { background: rgba(159,208,240,.12); }
      .screennote__x {
        font: inherit; background: none; border: 0; color: var(--bar-fg);
        cursor: pointer; margin-left: auto; padding: 2px 4px; opacity: .75;
      }
      .screennote__x:hover { opacity: 1; }

      /* --- main layout --- */
      main { flex: 1; display: flex; min-height: 0; }
      .sidebar {
        width: 240px; flex: 0 0 240px; background: var(--panel);
        border-right: 1px solid var(--line); overflow-y: auto; padding: 12px;
      }
      /* sidebar = project manager: active project + its datasets, other projects,
         building blocks */
      .proj__head { display: flex; align-items: center; gap: 4px; margin: 0 0 10px; }
      .proj__name { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; color: #1a1a1a; word-break: break-word; }
      .proj__sub { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #646e77; margin: 0 0 6px; }
      .proj__sub--zone { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
      .proj__empty { font-size: 12px; color: #6c7882; padding: 4px 8px; }
      .proj__datasets { list-style: none; margin: 0 0 10px; padding: 0; }
      .proj__ds {
        display: flex; align-items: center; gap: 6px; padding: 7px 8px;
        border-radius: 6px; border: 1px solid transparent; cursor: pointer; margin-bottom: 2px;
      }
      .proj__ds:hover { background: #f0f3f6; }
      .proj__ds--active { background: #e6f0fa; border-color: var(--accent); }
      /* Genuine subordination — a record that really does belong to the dataset above it
         (CAQDAS coding). Indented with a rule, but the SAME row treatment: it is a
         relationship, not a lower class of thing (#153). Project-scoped records are peers
         of the datasets and are not nested at all. */
      .proj__ds--nested { margin-left: 14px; border-left: 2px solid var(--line); border-radius: 0 6px 6px 0; }
      .proj__ds-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
      /* It is a <button> when the row is actionable; strip the UA chrome so it still
         reads as the dataset's name rather than a control. */
      button.proj__ds-name {
        font: inherit; font-weight: 600; text-align: left; background: none;
        border: 0; padding: 0; color: inherit; cursor: pointer;
      }
      .proj__ds-rows { font: 12px ui-monospace, Menlo, monospace; color: #646e77; }
      /* row action icons (✎ rename, ✕ remove) — visible, darken on hover */
      .proj__ds-x { border: 0; background: none; color: #646e77; cursor: pointer; font-size: 12px; padding: 0 3px; border-radius: 4px; }
      .proj__ds-x:hover:not(:disabled) { color: #1a1a1a; background: #dfe5ea; }
      .proj__ds-x:disabled { opacity: .3; cursor: default; } /* greyed, still visible */
      .proj__ds-edit { flex: 1; min-width: 0; font: inherit; padding: 2px 4px; border: 1px solid var(--accent); border-radius: 4px; }
      .proj__blob {
        display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 24px;
        font-size: 12px; color: #6b7685; margin-bottom: 1px;
      }
      .proj__blob-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* where a listed project lives — dim, so it reads as a detail rather than a name */
      .proj__ds-where { font-size: 11px; color: #646e77; white-space: nowrap; flex: 0 0 auto; }

      /* project manager (#173): one modal, location as a dimension inside a verb.
         Sizes here deliberately match the rest of the app: body text is 14px, so a
         secondary label is 13 and never 12, and a button matches `.ct-dialog__buttons
         button` (14px / 8px 16px) rather than inventing a smaller one. */
      /* Beats `.ct-dialog--wide`'s 640px, which this needs for the rail + pane split. */
      .ctpm.ct-dialog--wide { max-width: min(800px, 94vw); width: 94vw; }
      .ctpm__shell { display: flex; flex-direction: column; }
      .ctpm__tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
      .ctpm__tab { font: inherit; font-size: 15px; border: 0; background: none; padding: 9px 16px;
        cursor: pointer; color: #4a5560; border-bottom: 2px solid transparent; border-radius: 4px 4px 0 0; }
      .ctpm__tab:hover { background: #eef5fb; }
      .ctpm__tab.is-active { color: #1a1a1a; font-weight: 600; border-bottom-color: var(--accent); }
      .ctpm__body { min-height: 300px; max-height: 58vh; overflow: auto; padding: 4px 0 0; }
      .ctpm__split { display: flex; gap: 14px; align-items: stretch; }
      .ctpm__rail { flex: 0 0 180px; display: flex; flex-direction: column; gap: 4px;
        border-right: 1px solid var(--line); padding-right: 12px; }
      /* Matches `.ctl__source` in the launcher — the app's existing "pick a thing from a
         list" control, which is exactly what this is. */
      .ctpm__railitem { font: inherit; font-size: 14px; text-align: left; border: 0; background: none;
        cursor: pointer; padding: 10px 12px; border-radius: 8px; color: #2a3540; }
      .ctpm__railitem:hover { background: #eef5fb; }
      .ctpm__railitem.is-active { background: #e3edf7; font-weight: 600; }
      .ctpm__pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
      .ctpm__list { display: flex; flex-direction: column; gap: 3px; }
      .ctpm__row { display: flex; align-items: center; gap: 8px; border-radius: 6px; }
      .ctpm__row:hover { background: #f4f7fa; }
      .ctpm__row.is-open { background: #eef5fb; }
      .ctpm__rowmain { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px;
        font: inherit; font-size: 15px; text-align: left; border: 0; background: none;
        cursor: pointer; padding: 11px 12px; }
      /* the open project: present so the list is complete, inert because there is nothing
         to do to it from here */
      .ctpm__rowmain:disabled { cursor: default; opacity: .85; }
      .ctpm__name { font-weight: 600; color: #1a1a1a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ctpm__where { font-size: 13px; color: #646e77; white-space: nowrap; }
      .ctpm__acts { display: flex; gap: 4px; padding-right: 8px; }
      /* Same metrics as `.ct-dialog__buttons button`, because it is the same kind of
         thing — a button in a dialog. */
      .ctpm__act { font: inherit; border: 1px solid var(--line); background: #fff;
        border-radius: 6px; padding: 8px 16px; cursor: pointer; color: #2a3540; }
      .ctpm__act:hover { background: #eef5fb; }
      .ctpm__act.is-danger { color: #a33; border-color: #e3c3c3; }
      .ctpm__act.is-danger:hover { background: #fdf2f2; }
      .ctpm__hint { color: #5a6470; margin: 0 0 12px; line-height: 1.45; } /* = .ct-dialog__hint */
      .ctpm__empty, .ctpm__loading { color: #646e77; padding: 32px 12px; }
      /* Export-tab group heads (#181). The two groups differ in what the file can DO —
         reopen as a project, or not — so they are separated rather than listed flat. */
      .ctpm__grouphead { font-size: 1em; margin: 4px 0 4px; }
      .ctpm__grouphead + .ctpm__hint { margin-bottom: 8px; }
      .ctpm__grouphead ~ .ctpm__grouphead { margin-top: 18px; }
      /* Two classes, deliberately: `.ct-dialog__buttons` sets `margin: 0` and appears
         LATER in this file, so a single-class rule here would lose to it and the footer
         would sit flush against the list. */
      .ct-dialog__buttons.ctpm__footer { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
      /* memo thread under a row: the notes wrap and are read in full — truncating the
         one place a memo can be read would defeat the point of counting them (#168) */
      .proj__memos { display: block; padding: 2px 8px 4px 24px; font-size: 12px; }
      .proj__memo { display: flex; align-items: flex-start; gap: 4px; margin-bottom: 3px; }
      .proj__memo-text { flex: 1; min-width: 0; color: #4a5560; overflow-wrap: anywhere; }
      .proj__add {
        width: 100%; font: inherit; font-size: 13px; padding: 6px;
        border: 1px dashed var(--line); border-radius: 6px; background: #fff; color: #5a6470; cursor: pointer;
      }
      .proj__add:hover { background: #eef5fb; color: #1a1a1a; }

      /* workspace: tabbed main area (Data / Variables / Output) */
      /* min-width:0 so this flex item clips its wide grid instead of expanding to
         the table's full width (which would defeat column virtualisation). */
      .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
      .tabs {
        display: flex; gap: 2px; background: var(--panel);
        border-bottom: 1px solid var(--line); padding: 0 8px; flex: none;
      }
      .tab {
        background: transparent; border: 0; border-bottom: 2px solid transparent;
        font: inherit; padding: 9px 14px; cursor: pointer; color: #5a6470;
      }
      .tab:hover { color: #1a1a1a; }
      .tab[aria-selected="true"] { color: #1a1a1a; border-bottom-color: var(--accent); font-weight: 600; }
      .tab-action {
        margin-left: auto; align-self: center; background: transparent;
        border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px;
        padding: 4px 10px; cursor: pointer; color: #5a6470;
      }
      .tab-action:hover { background: #eef5fb; color: #1a1a1a; }
      .tab-action[hidden] { display: none; }
      .view { flex: 1; overflow: auto; min-height: 0; min-width: 0; }
      /* The data-grid panel lays out as a flex column (toolbar + scroller). A
         class (not inline style) so `.view[hidden]` still wins and hides it. */
      .ct-gridhost { display: flex; flex-direction: column; overflow: hidden; }
      .view[hidden] { display: none; }

      /* R Console tab */
      .rconsole { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
      .rc-varsbar {
        flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--line); background: var(--panel);
      }
      /* "include missing values" (#159) — sits with the picker because it changes what
         the picked variables CONTAIN, not how the console behaves. */
      .rc-keepmissing {
        flex: none; display: inline-flex; align-items: center; gap: 5px;
        font-size: 12px; color: #5a6470; white-space: nowrap; cursor: pointer; user-select: none;
      }
      .rc-keepmissing input { margin: 0; cursor: pointer; }
      .rc-filter {
        flex: none; width: 140px; font: inherit; font-size: 13px; padding: 4px 8px;
        border: 1px solid var(--line); border-radius: 6px;
      }
      /* Single-line, horizontally scrolling — matches the data grid headers so a
         wide file (GSS) stays a tidy strip instead of a wall of wrapped rows. */
      .rc-vars {
        flex: 1; min-width: 0; display: flex; flex-wrap: nowrap; gap: 14px;
        overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding-bottom: 2px;
      }
      .rc-var { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; white-space: nowrap; flex: none; }
      .rc-vars__empty { color: #888; font-style: italic; font-size: 13px; }
      .rc-info { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: #444; background: #fafbfc; }
      .rc-info__line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0; }
      .rc-info__k { color: #646e77; }
      .rc-vars-info { font-family: ui-monospace, Menlo, Consolas, monospace; color: #1d2733; }
      .rc-libs-info { font-family: ui-monospace, Menlo, Consolas, monospace; color: #1d2733; flex: 1; min-width: 0; }
      .rc-lib-add { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; width: 130px; }
      /* The terminal is one scroller; the prompt flows as the last line, right
         after the latest output (like the webR/RStudio console) rather than being
         pinned to the bottom of the pane. */
      .rc-term {
        flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px;
        white-space: pre-wrap; word-break: break-word; cursor: text;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.45;
      }
      .rc-term > div { margin: 0 0 2px; }
      .rc-cmd { color: #2563a8; }
      .rc-result { color: #1a1a1a; }
      .rc-err { color: #b3201a; }
      .rc-note { color: #646e77; font-style: italic; }
      .rc-plot {
        display: block; max-width: 100%; max-height: 360px; height: auto; width: auto;
        margin: 6px 0 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff;
      }
      .rc-prompt { display: flex; align-items: flex-start; gap: 6px; }
      .rc-caret { color: var(--accent); font-weight: 700; }
      .rc-input {
        flex: 1; border: 0; outline: none; background: transparent; font: inherit; color: #1a1a1a;
        resize: none; overflow-y: auto; line-height: 1.45; padding: 0; max-height: 160px;
      }
      .rc-input:disabled { color: #aaa; }
      .results { background: var(--bg); }

      /* The filter + order strip above EVERY list of variables — the Data grid's
         columns, Variable View's rows, and the analysis picker (core/var-toolbar.js).
         One rule set, so the three cannot look like three different controls. */
      .ct-vartools { display: flex; align-items: center; gap: 12px; flex: none; flex-wrap: wrap; }
      /* In a panel it is a toolbar and brings its own chrome; in a dialog it is
         just a row and must not draw a bar across the modal. */
      .ct-vartools--bar {
        padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      .ct-vartools--dialog { gap: 8px; margin: 0 0 6px; }
      /* Wide enough for its own placeholder, and allowed to grow. A fixed
         min-width clipped the longer of two placeholders while the shorter one
         fitted, so the two surfaces looked like different controls; `ch` ties the
         floor to the text rather than to a guess. */
      .ct-vartools__q {
        font: inherit; padding: 5px 8px; border: 1px solid var(--line);
        border-radius: 6px; flex: 1 1 28ch; min-width: 28ch; max-width: 340px;
      }
      .ct-vartools__order {
        font: inherit; font-size: 13px; padding: 5px 8px; flex: none;
        border: 1px solid var(--line); border-radius: 6px; background: #fff;
      }
      /* The count after the controls is each surface's own fact — selection in the
         grid, filter result in Variable View and the picker — so only its look is
         shared, not its text. */
      .ct-vartools__count { font-size: 12px; color: #646e77; }
      .ct-vartools__count--dialog { margin: 0 0 6px; color: #5a6470; }
      .grid-scroll { flex: 1; overflow: auto; min-height: 0; min-width: 0; }
      /* column header: a selection checkbox + an ellipsised label */
      .colhead { display: flex; align-items: center; gap: 6px; cursor: pointer; overflow: hidden; }
      .colhead__check { flex: none; margin: 0; }
      .colhead__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* data grid (Data View) — 2-D virtualised, fixed column widths */
      /* border-collapse:SEPARATE (not collapse): with collapse, a sticky header's
         borders are shared with the first row, so the seam bleeds (data peeking
         through) and the header's bottom edge gets clipped. Separate borders move
         with each cell, so the sticky header stays opaque. Cells carry only
         right+bottom borders to avoid doubled 2px lines; outer top/left edges are
         added to the header / first column. */
      .grid { border-collapse: separate; border-spacing: 0; font: 13px/1 system-ui, sans-serif; }
      .grid th, .grid td {
        border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
        padding: 5px 8px; height: 28px;
        width: 120px; max-width: 120px; box-sizing: border-box;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
      }
      /* Header above body (z2 > data z0); sits over the row-number column too. The
         top border gives the grid its top edge (cells only carry bottom borders). */
      .grid thead th {
        position: sticky; top: 0; z-index: 2; background: var(--panel); font-weight: 600;
        border-top: 1px solid var(--line);
      }
      .grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .grid .rownum, .grid th.corner {
        /* .rownum is a <th scope="row"> for screen readers; keep it looking like a
           gutter number rather than inheriting the UA's bold header weight. */
        font-weight: 400;
        position: sticky; left: 0; z-index: 1; width: 56px; max-width: 56px;
        background: var(--panel); color: #646e77; border-left: 1px solid var(--line);
        text-align: right; font-variant-numeric: tabular-nums;
      }
      /* The top-left corner must beat both the sticky header and the sticky gutter. */
      .grid thead th.corner { z-index: 3; }
      .grid td.na { color: #c0c6cc; }
      /* editable data cells (double-click to edit → sparse override transform) */
      .grid td.cell { cursor: cell; }
      .grid td.cell:hover { background: #f0f6fc; }
      /* A cell carrying memos (#152) — a corner triangle, the spreadsheet convention.
         Always visible: a note nobody can see is a note nobody re-reads. */
      .grid td.has-memo { position: relative; }
      .grid td.has-memo::after {
        content: ""; position: absolute; top: 0; right: 0;
        border-top: 7px solid #c2410c; border-left: 7px solid transparent;
      }
      .cell-edit {
        width: 100%; box-sizing: border-box; font: inherit;
        border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; margin: -2px 0;
      }
      /* virtualisation spacers: no border/padding; size set inline */
      .grid td.spacer { padding: 0; border: none; overflow: hidden; }
      .grid-empty { padding: 16px; color: #646e77; }

      /* variable view — metadata table */
      .vargrid { border-collapse: collapse; width: 100%; font: 13px/1.4 system-ui, sans-serif; }
      .vargrid th, .vargrid td {
        border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top;
      }
      .vargrid thead th {
        position: sticky; top: 0; background: var(--panel);
        font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #646e77;
      }
      .vargrid code { font: 12px ui-monospace, Menlo, monospace; color: #1a1a1a; }
      .vargrid__row { cursor: pointer; }
      /* The variable name is a button (keyboard route to the row's editor) but should
         look exactly like the code text it replaced. */
      .vargrid__open {
        font: inherit; background: none; border: 0; padding: 0; margin: 0;
        color: inherit; cursor: pointer; text-align: left;
      }
      .vargrid__row:hover { background: #eef5fb; }

      /* history / rewind panel */
      .ct-historyhost { padding: 4px 2px; }
      .history { list-style: none; margin: 0; padding: 0; font: 13px/1.4 system-ui, sans-serif; }
      .history__step { position: relative; display: flex; align-items: center; }
      /* connector line behind the markers (markers sit above it, opaque) */
      .history__step:not(:last-child)::before {
        content: ''; position: absolute; left: 20px; top: 19px; bottom: -1px;
        width: 2px; background: #e0e5eb; z-index: 0;
      }
      .history__btn {
        display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0;
        text-align: left; background: none; border: 0; cursor: pointer;
        padding: 7px 10px; border-radius: 6px; color: #1a1a1a; font: inherit;
      }
      /* per-step controls: move up/down, delete */
      /* Always visible — NOT revealed on hover (owner, 2026-09-27: "touch devices dont have
         hover"). These were `opacity: 0` until the row was hovered, which on a phone meant an
         INVISIBLE BUT TAPPABLE row of buttons, delete included: a transparent control still
         takes pointer events, so the affordance was not merely missing, it was a trap. The
         hover highlight on each button (below) is still the pointer nicety; visibility is not.
         Full strength rather than dimmed, because a dimmed glyph on white drops under the 3:1
         WCAG needs for a control — quiet has to come from size and colour, not opacity. */
      .history__ctl { display: flex; gap: 1px; flex: none; padding-right: 4px; }
      /* The Syntax gutter's copies of the same controls (#189), styled here so the two cannot
         drift apart the way the two pickers' tooltips did. */
      .history-panel__gctl { display: flex; gap: 1px; flex: none; }
      .history__ctlbtn {
        border: 0; background: none; cursor: pointer; color: #687381; font-size: 12px;
        width: 20px; height: 22px; border-radius: 4px; line-height: 1;
      }
      .history__ctlbtn:hover:not(:disabled) { background: #e3e8ee; color: #1a1a1a; }
      .history__ctlbtn:disabled { opacity: .25; cursor: default; }
      /* floating History panel (Edit ▸ History…) — non-blocking, grid stays live */
      .history-panel {
        position: fixed; top: 52px; right: 12px; bottom: 12px; width: 340px; z-index: 50;
        background: var(--panel, #fff); border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0,0,0,.22); display: flex; flex-direction: column; overflow: hidden;
      }
      .history-panel[hidden] { display: none; }
      /* Syntax mode is a text editor — give it the full viewport width (Steps mode
         stays the compact right-docked timeline). top/bottom come from the base rule. */
      .history-panel--full { left: 12px; right: 12px; width: auto; }
      .history-panel__head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 12px; border-bottom: 1px solid var(--line);
      }
      .history-panel__title { font-weight: 700; font-size: 14px; }
      .history-panel__close { font-size: 13px; width: 24px; height: 24px; }
      .history-panel__toolbar { padding: 7px 12px; border-bottom: 1px solid var(--line); }
      .history-panel__action {
        font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
        background: #fff; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;
      }
      .history-panel__action:hover { background: #f0f7ff; }
      .history-panel__err {
        background: #fdf3f2; color: #7a201a; font-size: 12px; padding: 7px 12px;
        border-bottom: 1px solid #f0d8d5;
      }
      .history-panel__content { flex: 1; overflow: auto; padding: 8px 6px; }
      .history__btn:hover:not(:disabled) { background: #eef5fb; }
      .history__btn:disabled { cursor: default; }
      .history__marker {
        position: relative; z-index: 1; flex: none; width: 22px; height: 22px;
        border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
        font-size: 12px; line-height: 1; background: #e3e8ee; color: #51606e;
      }
      .history__step--current > .history__btn > .history__marker { background: var(--accent); color: #fff; }
      .history__step--future > .history__btn { color: #9aa6b1; }
      .history__step--future > .history__btn > .history__marker { background: #f0f2f5; color: #b3bcc6; }
      .history__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .history__title { font-weight: 600; }
      .history__detail { font-size: 12px; color: #646e77; }
      .history__step--future .history__detail { color: #aeb7c0; }
      .history__badge {
        margin-left: auto; align-self: center; font-size: 11px; font-weight: 600;
        color: var(--accent); background: #eaf2fb; padding: 1px 8px; border-radius: 10px;
      }
      .history-hint { color: #646e77; font-size: 13px; line-height: 1.5; padding: 4px 12px 0; max-width: 48ch; }

      /* variable metadata editor (recode) */
      .ct-edit { min-width: 380px; }
      .ct-field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; font-size: 13px; }
      .ct-field input, .ct-field select, .ct-field textarea {
        font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
      }
      .ct-field textarea { resize: vertical; font: 12px ui-monospace, monospace; }
      .ct-row { display: flex; gap: 12px; }
      /* min-width:0 lets a field shrink below its content: without it a <select> or
         button holding a long variable label can't shrink and shoves its siblings
         (the "new variable" name) off the dialog. */
      .ct-row .ct-field { flex: 1; min-width: 0; }
      .ct-hint { color: #646e77; font-weight: 400; font-size: 11px; }
      /* Live new-variable-name validation (Compute / Recode / Count): a red box + a
         message below the field the moment a disallowed name is typed. */
      .ct-field input.is-invalid { border-color: #cf5560; box-shadow: 0 0 0 1px #cf5560; outline: none; }
      .ct-cr__nameerr { color: #b3424a; font-size: 11px; margin: 2px 0 0; }
      /* Recode's "Recode from" — a button that opens the shared variable picker,
         styled like a <select> and ellipsising a long label instead of growing. */
      .ct-cr__pick {
        display: flex; align-items: center; gap: 6px; width: 100%;
        font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
        background: #fff; cursor: pointer; text-align: left;
      }
      .ct-cr__pick:hover { background: #f0f3f6; }
      .ct-cr__picklabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ct-cr__pickcaret { color: #646e77; flex: 0 0 auto; }

      /* --- footer / status --- */
      footer {
        border-top: 1px solid var(--line); background: var(--panel);
        padding: 6px 12px; font-size: 12px; color: #5a6470;
      }
      .lib-status { margin-left: 16px; color: #646e77; }

      /* dataset library modal: one row per saved entry */
      .ct-lib__list { max-height: 50vh; }
      .ct-lib__row {
        display: flex; align-items: center; gap: 12px;
        padding: 8px; border-radius: 6px;
      }
      .ct-lib__row:hover { background: #f0f3f6; }
      .ct-lib__info { flex: 1; min-width: 0; }
      .ct-lib__name { font-weight: 600; }
      .ct-lib__meta { font-size: 12px; color: #646e77; }
      .ct-lib__actions { display: flex; gap: 6px; flex: none; }
      .ct-lib__actions button {
        font: inherit; font-size: 13px; padding: 5px 12px;
        border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer;
      }
      .ct-lib__delete { color: #b03030; }
      .ct-lib__delete:hover { background: #fbeaea; }

      /* --- analysis dialogs (rendered by plugins) --- */
      .ct-dialog {
        border: 1px solid var(--line); border-radius: 10px; padding: 0;
        box-shadow: 0 16px 48px rgba(0,0,0,.25); max-width: 420px; width: 92vw;
      }
      .ct-dialog::backdrop { background: rgba(0,0,0,.35); }
      .ct-dialog--wide { max-width: 640px; }
      /* Recode carries a 7-column rule grid (two selects + two value inputs + a label);
         640px squeezes the value inputs to a sliver, so give it more room. */
      .ct-cr-dialog.ct-dialog--wide { max-width: min(800px, 96vw); }

      /* sync-conflict resolver: roomier, and each choice on its own line */
      .ct-conflict-dialog { max-width: 560px; }
      .ct-conflict { margin: 0 0 14px; }
      .ct-conflict:last-of-type { margin-bottom: 0; }
      .ct-conflict__head { font-weight: 600; margin: 0 0 8px; }
      .ct-conflict__opts { display: flex; flex-direction: column; gap: 6px; }
      .ct-conflict__opt {
        display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px;
        border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
      }
      .ct-conflict__opt:hover { background: #f4f8fc; }
      .ct-conflict__opt:has(input:checked) { border-color: var(--accent); background: #eef5fb; }
      .ct-conflict__opt input { margin-top: 3px; flex: none; }

      /* join review dialog */
      .ct-join__keys { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
      .ct-join__keys select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
      .ct-join__summary { margin: 0 0 10px; font-size: 13px; color: #5a6470; }
      .ct-join__cols { display: flex; gap: 12px; }
      .ct-join__side { flex: 1; min-width: 0; }
      .ct-join__side-head { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #646e77; margin: 0 0 4px; }
      .ct-join__list {
        list-style: none; margin: 0; padding: 4px; height: 30vh; overflow-y: auto;
        border: 1px solid var(--line); border-radius: 6px;
      }
      .ct-join__list li { padding: 5px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ct-join__list li:hover { background: #f0f3f6; }
      .ct-join__list li.sel { background: #e6f0fa; outline: 1px solid var(--accent); }
      .ct-join__pair {
        margin: 10px 0; font: inherit; font-size: 13px; padding: 6px 12px;
        border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer;
      }
      .ct-join__pair:disabled { opacity: .5; cursor: default; }
      .ct-join__manual-head { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #646e77; margin: 4px 0; }
      .ct-join__manual-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
      .ct-join__manual-row button { border: 0; background: none; cursor: pointer; color: #b03030; font-size: 13px; }
      .ct-dialog__form { padding: 20px; }
      .ct-dialog__title { margin: 0 0 4px; font-size: 18px; }
      .ct-dialog__hint { margin: 0 0 12px; color: #5a6470; }
      /* Plain bulleted list inside a dialog (e.g. the missing-plugins warning). */
      .ct-dialog__list { margin: 0 0 16px; padding: 0 0 0 20px; max-height: 40vh; overflow-y: auto; }
      .ct-dialog__list li { margin: 0 0 6px; line-height: 1.4; }
      .ct-dialog__vars { list-style: none; margin: 0 0 16px; padding: 0; max-height: 40vh; overflow-y: auto; }
      .ct-dialog__vars label {
        display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; cursor: pointer;
      }
      .ct-dialog__vars label:hover { background: #f0f3f6; }
      /* group label inside the picker ("Selected" / "All variables") */
      .ct-dialog__vars li.ct-dialog__group {
        font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
        color: #646e77; padding: 10px 8px 2px; pointer-events: none;
      }
      .ct-dialog__vars li.ct-dialog__group + li label { border-top: 0; }
      .ct-dialog__vars code { color: #646e77; font-size: 12px; }
      /* The explicit "none" choice on an optional single-select picker, kept apart
         from the variables so it reads as an answer rather than as one of them. */
      .ct-dialog__vars li.ct-dialog__none label { color: #5a6470; font-style: italic; }
      .ct-dialog__vars li.ct-dialog__none { border-bottom: 1px solid var(--line); margin-bottom: 4px; padding-bottom: 2px; }
      /* A variable disabled because a prior `unique` input already took it. */
      .ct-dialog__vars li.ct-dialog__excluded label { opacity: .5; cursor: not-allowed; }
      .ct-dialog__taken { margin-left: auto; font-size: 11px; color: #b07; font-style: italic; }
      /* Which dataset a variable came from, when it is not the active one (#179). Colours
         are the muted-but-legible pair used for secondary text elsewhere: 4.6:1 on the row
         background, so it passes AA as small text rather than relying on the reader
         noticing a colon in the code beside it. */
      .ct-dialog__dsbadge {
        margin-left: auto; font-size: 11px; color: #3c4a57; background: #eef2f6;
        border: 1px solid #d7e0e8; border-radius: 999px; padding: 1px 7px; white-space: nowrap;
      }
      /* The cross-dataset scope switch, on the picker's filter strip. */
      .ct-vartools__scope { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #3c4a57; white-space: nowrap; }
      .ct-vartools__scope input { margin: 0; }
      .ct-dialog__buttons { display: flex; justify-content: flex-end; gap: 8px; margin: 0; padding: 0; }
      .ct-dialog__buttons button {
        font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line);
        background: #fff; cursor: pointer;
      }
      /* Specificity must beat `.ct-dialog__buttons button` (0,1,1) above, else the
         white base background wins and leaves white text on white. */
      .ct-dialog__buttons .ct-dialog__primary {
        background: var(--accent); color: #fff; border-color: var(--accent);
      }
      /* Destructive choice (e.g. "Delete data and remove from project", #118). */
      .ct-dialog__buttons .ct-dialog__danger {
        background: #fff; color: #c0392b; border-color: #e3b4ad;
      }
      /* Stacked, full-width choices for a multi-option prompt (most-recommended
         first, top-to-bottom) rather than a right-aligned row. */
      .ct-dialog__buttons--stack { flex-direction: column; align-items: stretch; gap: 8px; }
      .ct-dialog__buttons--stack button { text-align: center; }
      /* Labelled select rows (e.g. the dataset-join key/type chooser, #121). */
      .ct-dialog__row { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; font-size: 13px; }
      .ct-dialog__row > span { color: #555; }
      .ct-dialog__row select {
        font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
      }
      /* Unified Import data… / Export data… format picker */
      .ct-fmt__search {
        width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px;
        border: 1px solid var(--line); border-radius: 6px; margin: 0 0 10px;
      }
      .ct-fmt__list { max-height: 50vh; overflow-y: auto; margin: 0 0 16px; }
      .ct-fmt__group {
        font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
        color: #646e77; padding: 10px 4px 4px;
      }
      .ct-fmt__row {
        display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
        font: inherit; padding: 9px 10px; border: 0; border-radius: 6px;
        background: transparent; cursor: pointer;
      }
      .ct-fmt__row:hover { background: #eef5fb; }
      /* Was `outline: none` with only the hover background to stand in — #eef5fb on
         white is 1.10:1, so the focused row was indistinguishable from the rest.
         Keep the tint, restore a real ring (WCAG 2.4.11 wants 3:1). */
      .ct-fmt__row:focus-visible { background: #eef5fb; }
      .ct-fmt__name { flex: 0 1 auto; }
      .ct-fmt__ext { margin-left: auto; color: #646e77; font-size: 12px; white-space: nowrap; }
      .ct-fmt__empty { color: #646e77; padding: 16px 4px; }
      /* "Export as" filename dialog */
      .ct-saveas { max-width: 420px; }
      .ct-saveas__field {
        display: flex; align-items: stretch; border: 1px solid var(--line);
        border-radius: 6px; overflow: hidden; background: #fff;
      }
      .ct-saveas__field:focus-within { border-color: var(--accent); }
      .ct-saveas__name {
        flex: 1 1 auto; min-width: 0; font: inherit; padding: 8px 10px;
        border: 0; outline: none; background: transparent;
      }
      .ct-saveas__ext {
        flex: 0 0 auto; align-self: center; padding: 0 10px 0 4px;
        color: #646e77; font-size: 13px; white-space: nowrap;
      }
      /* The plugin picker (launcher centre AND Edit ▸ Plugins) styles itself from
         core/plugin-picker.js, because one component cannot depend on which host page
         loaded its CSS. All that is left here is the "add from URL" prompt. */
      .ct-plugins__urlinput {
        width: 100%; box-sizing: border-box; font: inherit; margin: 0 0 4px;
        padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
      }

      /* Plugin creator dialog */
      .ct-creator { max-width: 760px; width: 90vw; }
      .ct-creator__row { margin: 0 0 8px; }
      /* Simple/Code mode toggle */
      .ct-creator__modes { display: inline-flex; gap: 0; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .ct-creator__mode { font: inherit; font-size: 13px; padding: 5px 14px; cursor: pointer; background: #fff; border: 0; border-right: 1px solid var(--line); color: #555; }
      .ct-creator__mode:last-child { border-right: 0; }
      .ct-creator__mode.is-active { background: var(--accent); color: #fff; }
      /* Simple-mode form */
      .ct-creator__field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #333; margin: 0 0 12px; }
      .ct-creator__cat, .ct-creator__name { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; max-width: 340px; }
      .ct-creator__inputs { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; }
      .ct-creator__inputrow { display: flex; gap: 6px; align-items: center; }
      .ct-creator__inname { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; width: 130px; }
      .ct-creator__inkind { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; flex: 1; }
      .ct-creator__inopt { font-size: 12px; color: #555; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
      .ct-creator__inrm { border: 0; background: none; color: #b3424a; cursor: pointer; font-size: 13px; }
      .ct-creator__addinput, .ct-creator__tpl { font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer; background: #f4f7fb; border: 1px solid var(--line); border-radius: 999px; align-self: flex-start; margin-top: 4px; }
      .ct-creator__addinput:hover { background: #e8f1fb; border-color: var(--accent); }
      .ct-creator__radio { font-size: 13px; margin-right: 14px; display: inline-flex; align-items: center; gap: 4px; }
      .ct-creator__r { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; min-height: 130px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; white-space: pre; }
      .ct-creator__rhint { font-size: 12px; color: #777; margin: 4px 0 0; }
      .ct-creator__namelbl {
        font-size: 13px; color: #333; display: flex; flex-direction: column; gap: 4px; max-width: 340px;
      }
      .ct-creator__name {
        font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
      }
      .ct-creator__templates { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
      .ct-creator__tpl {
        font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer;
        background: #f4f7fb; border: 1px solid var(--line); border-radius: 999px;
      }
      .ct-creator__tpl:hover { background: #e8f1fb; border-color: var(--accent); }
      .ct-creator__editor {
        display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
        height: 360px; background: #fbfcfd;
      }
      .ct-creator__gutter {
        flex: none; width: 40px; padding: 8px 6px; text-align: right; color: #9aa6b2;
        background: #f1f4f7; border-right: 1px solid var(--line);
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5;
        white-space: pre; overflow: hidden; user-select: none;
      }
      .ct-creator__code {
        flex: 1; border: 0; resize: none; padding: 8px 10px; outline: none; background: transparent;
        color: #1d2733; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
        line-height: 1.5; white-space: pre; tab-size: 2;
      }
      .ct-creator__status {
        margin: 8px 0 0; font-size: 12px; padding: 7px 10px; border-radius: 6px;
        background: #eef7ee; color: #1e5b2a; border: 1px solid #cfe6cf;
      }
      .ct-creator__status--err { background: #fdf3f2; color: #7a201a; border-color: #f0d8d5; }
      /* #180: where the floated (selected) variables end. The picker can label its
         "Selected" group with a heading; a grid and a dense table cannot, so the boundary
         is a rule instead — down the left edge of the first unselected column, and under
         the last selected row. Drawn only when there IS a boundary. */
      .grid th.is-floatedge, .grid td.is-floatedge { border-left: 2px solid var(--accent, #2572a5); }
      .vargrid__row.is-floatedge > * { border-top: 2px solid var(--accent, #2572a5); }


      /* Compute / Recode dialogs */
      .ct-cr__expr { font: 12px ui-monospace, Menlo, monospace; resize: vertical; }
      .ct-cr__palette { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; max-height: 96px; overflow: auto; }
      /* Separator between the grid-selected chips (floated to the top) and the rest —
         flex-basis:100% forces it onto its own line so the two groups don't run together. */
      .ct-cr__palette-sep { flex: 0 0 100%; height: 0; border-top: 1px solid var(--line); margin: 3px 0; }
      .ct-cr__chip {
        font: 11px ui-monospace, Menlo, monospace; padding: 2px 8px; cursor: pointer;
        background: #eef5fb; border: 1px solid var(--line); border-radius: 10px; color: #1a4a73;
      }
      .ct-cr__chip:hover { background: #dcebfa; }
      .ct-cr__ruleshead, .ct-cr__rule, .ct-cr__else {
        /* old-kind | old-value | → | new-kind | new-value | label | ✕. The new value
           gets its OWN column (it used to share one cell with the new-kind select, which
           squeezed the input down to a sliver). */
        display: grid; grid-template-columns: 90px 1fr 18px 130px 1fr minmax(110px, .8fr) 24px;
        gap: 8px; align-items: center; margin: 4px 0;
      }
      /* The per-rule value label ("1 = Agree"). The cell keeps the grid column
         even when the input is hidden (target isn't a value), so the remove
         button never slides sideways under the cursor. */
      .ct-cr__tolabelcell { display: flex; min-width: 0; }
      .ct-cr .ct-cr__tolabel { flex: 1; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; min-width: 0; }
      .ct-cr .ct-cr__tolabel[hidden] { display: none; }
      .ct-cr__ruleshead { color: #646e77; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 8px; }
      .ct-cr__else { grid-template-columns: auto minmax(150px, 1fr); margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
      .ct-cr__elselabel { color: #5a6470; font-size: 13px; }
      .ct-cr__frominputs { display: flex; gap: 4px; align-items: center; min-width: 0; }
      .ct-cr__frominputs input, .ct-cr .ct-cr__to input, .ct-cr .ct-cr__toval, .ct-cr select {
        font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; min-width: 0;
      }
      /* The new-value input is now its own grid cell — stretch it to fill the column. */
      .ct-cr__rule .ct-cr__toval { width: 100%; }
      .ct-cr__rule .ct-cr__toval[hidden] { display: none; }
      .ct-cr__frominputs input { flex: 1; }
      .ct-cr__to { display: flex; gap: 4px; }
      .ct-cr__to select { flex: none; }
      .ct-cr__to input { flex: 1; }
      .ct-cr__arrow { color: #646e77; text-align: center; }
      .ct-cr__rm { border: 0; background: none; color: #b3424a; cursor: pointer; font-size: 14px; padding: 0; }
      .ct-cr__addrule { font: inherit; font-size: 13px; background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--accent); margin-top: 4px; }
      .ct-cr__addrule:hover { background: #f0f7ff; }
      /* Count values within cases (#174k): the variable picker button + a value list. */
      .ct-cr__counthead { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #646e77; margin: 12px 0 4px; }
      .ct-cr__match { display: grid; grid-template-columns: 90px 1fr 24px; gap: 8px; align-items: center; margin: 4px 0; }
      .ct-cr__complete { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; cursor: pointer; }

      /* Export-output dialog uses .ct-dialog--wide (640px) so the four actions sit
         on one row; wrap is a fallback on very narrow viewports. Cancel sits apart
         on the left, the save actions on the right. */
      .ct-export__buttons { flex-wrap: wrap; }
      .ct-export__buttons button { white-space: nowrap; }
      .ct-export__buttons button[value="cancel"] { margin-right: auto; }

      /* --- busy indicator --- */
      /* A non-blocking "working" pill, shown while WebR is running a job (the
         slow path: package installs, file reads, analyses). pointer-events:none
         so it never traps clicks. */
      .busy {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px;
        background: var(--bar); color: var(--bar-fg);
        padding: 8px 16px; border-radius: 999px;
        box-shadow: 0 2px 10px rgba(0,0,0,.28);
        font-size: 13px; z-index: 1000; pointer-events: none;
      }
      .busy[hidden] { display: none; }
      .busy__spinner {
        width: 14px; height: 14px; border-radius: 50%; flex: none;
        border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
        animation: busy-spin .7s linear infinite;
      }
      @keyframes busy-spin { to { transform: rotate(360deg); } }
      /* --- small-screen arrangement (core/screen-mode.js) ---------------------
         Every rule here keys off `data-screen="small"` on <html> and NOTHING keys off
         viewport width: the user owns the mode, so the layout must not re-decide behind
         them. A repositioning and a resize only — no control is removed, hidden or
         simplified, which is the owner's acceptance criterion and a test in the suite.

         The tab strip scrolls at ANY width, not just here: it was already a latent bug
         with several workspace tabs open, and a tab you cannot reach is a view you cannot
         reach. */
      .tabs { overflow-x: auto; scrollbar-width: thin; }
      .tabs::-webkit-scrollbar { height: 6px; }

      /* The sidebar becomes the Project TAB — the same element, re-parented, so it keeps
         its content and listeners (see arrangeShell). As a pane it fills the workspace
         instead of being a fixed 240px column. */
      /* The whole menubar collapses to one ☰ button (see MenuShell#renderHamburger). The
         panel then holds every menu as a group, so it is long: give it the width it needs and
         let it scroll within itself rather than growing the page. */
      /* Anchored to the MENUBAR, not to the button: `nav.menubar` is already the positioned
         ancestor, so dropping the wrapper out of the positioning chain lets the panel span the
         bar instead of starting at the button and running off the right edge (measured: 392px
         of panel from x=96 on a 426px screen). */
      [data-screen="small"] .menu--all { position: static; }
      [data-screen="small"] .menu__panel--all {
        left: 0; right: 0; min-width: 0; width: auto;
        max-height: calc(100vh - 96px);
      }
      [data-screen="small"] .menu__panel--all .menu__group + .menu__group {
        border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px;
      }
      /* Touch targets: the same items, a little taller, which is a resize and not a redesign. */
      [data-screen="small"] .menu__item { padding: 11px 12px; }
      /* Collapsible sections in the ☰ panel. The heading becomes a real button, so it is
         bigger, tappable and reachable by keyboard — and reads as a control rather than a
         caption, which a plain uppercase label did not. */
      [data-screen="small"] .menu__group-toggle {
        display: flex; align-items: center; gap: 8px; width: 100%;
        background: none; border: 0; cursor: pointer; text-align: left;
        font: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
        color: #41505e; padding: 12px; border-radius: 4px;
      }
      [data-screen="small"] .menu__group-toggle:hover,
      [data-screen="small"] .menu__group-toggle[aria-expanded="true"] { background: #eef4fa; }
      [data-screen="small"] .menu__group-toggle[aria-expanded="true"] { color: #1a1a1a; font-weight: 700; }
      .menu__caret { display: inline-block; transition: transform .12s ease; font-size: 10px; }
      [aria-expanded="true"] > .menu__caret { transform: rotate(90deg); }
      /* Indent a section's items so the heading reads as their parent. */
      [data-screen="small"] .menu__group-toggle + .menu__flyout .menu__item { padding-left: 26px; }
      /* The separators between top-level sections were doing the work of telling groups
         apart; collapsed headings do that themselves, so the rules only add noise. */
      [data-screen="small"] .menu__panel--all .menu__group + .menu__group {
        border-top: 0; margin-top: 0; padding-top: 0;
      }
      [data-screen="small"] .tab { padding: 11px 13px; }
      /* Breathing room at the top (owner, running it as a Home Screen app, 2026-10-07:
         "iPhone doesn't have the Safari chrome but does have a slight haze at the top…
         perhaps we should include a slight buffer at the very top to avoid collision").

         Two things were touching. A 44px control inside a 44px bar fills it exactly, so the
         ☰ chip's border sat flush on both edges and read as clipped — that one shows in a
         browser tab too, and the header padding below is its fix. The other is iOS-specific:
         installed to the Home Screen there is no browser chrome between the system's
         translucent status overlay and our first pixel.

         The cushion is a MULTIPLE of the safe-area inset rather than a flat addition behind
         a `display-mode: standalone` query, which is both simpler and more correct:
           - browser tab, any platform — inset is 0, so the cushion is 0 and nothing moves;
           - iOS installed — inset is the status bar, so the cushion scales with it;
           - ANDROID installed — Chrome paints the status bar as its own opaque strip in
             theme_color and starts content below it, so the inset is 0 and Android gets no
             padding it has no use for. A flat +8px in standalone would have added it anyway.
         It also needs no media query at all, which keeps the promise that nothing in this
         app's layout is decided by asking the device about itself. */
      body { padding-top: calc(env(safe-area-inset-top) * 1.18); }
      [data-screen="small"] header { padding-top: 8px; padding-bottom: 8px; row-gap: 8px; }
      /* --- touch targets (owner, on the phone: "it seems a little tiny") -----------
         These are CSS pixels, which on iOS equal points — so 44 here IS Apple's 44pt
         guideline, not 44 device pixels; the phone's 3x display renders it at the same
         physical size. The unit was never the problem. What was wrong is that only the
         header's CONTAINER was 44 tall: measured in the small layout, the CrossTab brand
         was 24px, the ☰ button 40, and the sidebar's row icons 18x16 — which fails even
         WCAG 2.5.8's 24x24 minimum, never mind the 44 Apple asks for. A row of three
         adjacent 18px icons where one of them is a destructive ✕ is the worst version of
         that. Sizing the CONTROLS, not their containers. */
      [data-screen="small"] .brand {
        min-height: 44px; display: inline-flex; align-items: center;
        padding: 0 8px; margin: 0 -4px; font-size: 17px;
      }
      /* 44px of INVISIBLE target is still "a little tiny" to look at, which is what the
         owner was reporting after the size fix landed: transparent, borderless and regular
         weight, the ☰ read as a caption rather than the control that opens the whole menu.
         A chip makes the target visible, and the glyph is sized above the label so it reads
         as an icon instead of punctuation. */
      [data-screen="small"] .menu__button--all {
        display: inline-flex; align-items: center; gap: 8px;
        min-height: 44px; padding: 0 14px;
        font-size: 16px; font-weight: 600;
        border: 1px solid rgba(255, 255, 255, .38); border-radius: 8px;
      }
      [data-screen="small"] .menu__button--all:hover,
      [data-screen="small"] .menu__button--all[aria-expanded="true"] {
        background: rgba(255, 255, 255, .16);
      }
      .menu__burger { font-size: 21px; line-height: 1; }
      /* A row is a tap target in its own right (it switches the active dataset), and its
         icons sit inside it, so both need the size. */
      [data-screen="small"] .proj__ds { min-height: 44px; }
      [data-screen="small"] .proj__ds-x,
      [data-screen="small"] .proj__memo,
      [data-screen="small"] .ctp__act {
        min-width: 44px; min-height: 44px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 15px;
      }
      [data-screen="small"] .proj__add,
      [data-screen="small"] .proj__name,
      [data-screen="small"] .ctp__addbtn,
      [data-screen="small"] .ctp__linkbtn { min-height: 44px; }
      /* The picker's checkbox is the control you aim at most in the launcher, and a 13px
         box with a 13.5px label beside it is a poor target even with the row as backup. */
      [data-screen="small"] .ctp__main { min-height: 44px; font-size: 15px; }
      [data-screen="small"] .ctp__main input[type="checkbox"] { width: 20px; height: 20px; }

      /* :not([hidden]) is load-bearing. `.view[hidden] { display: none }` lives 600 lines up
         and has the SAME specificity as this rule, so a later `display: flex` here simply
         wins and the pane shows through whichever tab is selected — which is what it did
         (owner, on the phone: "Project tab isn't hiding properly behind other tabs"). The
         same trap the .ct-gridhost comment two hundred lines up warns about, approached from
         the other side: there the fix was to avoid an inline style, here it is to not match
         while hidden. */
      [data-screen="small"] .shell__projectpane:not([hidden]) { display: flex; min-height: 0; flex: 1; }
      [data-screen="small"] .shell__projectpane > .sidebar {
        width: auto; flex: 1; border-right: 0; min-width: 0;
      }

      /* The data grid keeps two-dimensional scrolling, deliberately: WCAG 1.4.10 exempts
         content that needs a 2-D layout for its meaning, and a data table is the example
         it gives. Turning 900 columns into stacked cards would be the "mobile friendly
         redesign" this whole feature exists to avoid. */
      [data-screen="small"] .ct-vartools { flex-wrap: wrap; }
      [data-screen="small"] .ct-vartools__q { flex: 1 1 100%; min-width: 0; }

      /* Dialogs already cap in vw; what they need is not to sit against the edges, and
         for a wide one to stop reserving width it cannot have. */
      /* A dialog had no max-height at all, so a long one could run past the bottom of a
         phone and take its buttons with it. dvh rather than vh: on iOS, vh is the viewport
         with the toolbars retracted, which is not the part you can see. */
      [data-screen="small"] .ct-dialog {
        width: 94vw; max-width: 94vw;
        max-height: 88vh; max-height: 88dvh; overflow: auto;
      }
      /* Same reason as the launcher: 16px controls, so focusing one does not zoom the page. */
      [data-screen="small"] input,
      [data-screen="small"] select,
      [data-screen="small"] textarea { font-size: 16px; }
      [data-screen="small"] .ct-dialog__form { padding: 14px; }
      [data-screen="small"] .ct-dialog__buttons { flex-wrap: wrap; }
    </style>
  </head>

  <body>
    <div class="busy" id="busy" role="status" aria-live="polite" hidden>
      <span class="busy__spinner" aria-hidden="true"></span>
      <span class="busy__text">Working…</span>
    </div>

    <header>
      <button type="button" class="brand" aria-label="CrossTab — open the launcher and plugin picker">CrossTab</button>
      <nav class="menubar" id="menubar" aria-label="Main menu"></nav>
    </header>

    <main>
      <aside class="sidebar" id="sidebar" aria-label="Variables"></aside>
      <section class="workspace">
        <div class="tabs" id="tabs" role="tablist" aria-label="Workspace views">
          <button class="tab" id="tab-data" role="tab" data-view="data">Data</button>
          <button class="tab" id="tab-vars" role="tab" data-view="vars">Variables</button>
          <button class="tab" id="tab-output" role="tab" data-view="output" aria-selected="true">Output</button>
          <button class="tab" id="tab-console" role="tab" data-view="console">R Console</button>
          <button class="tab-action" id="clear-output" type="button" title="Clear all output">Clear output</button>
        </div>
        <div class="view" id="view-data" role="tabpanel" aria-label="Data" hidden></div>
        <div class="view" id="view-vars" role="tabpanel" aria-label="Variables" hidden></div>
        <section class="view results" id="results" role="tabpanel" aria-label="Output" aria-live="polite"></section>
        <div class="view" id="view-console" role="tabpanel" aria-label="R Console" hidden></div>
      </section>
    </main>

    <footer><span id="status" role="status" aria-live="polite">Starting…</span></footer>

    <script type="module">
      import { boot } from './core/app.js';

      boot({
        menubar: document.getElementById('menubar'),
        sidebar: document.getElementById('sidebar'),
        results: document.getElementById('results'),
        status: document.getElementById('status'),
        busy: document.getElementById('busy'),
        tabs: document.getElementById('tabs'),
        viewData: document.getElementById('view-data'),
        viewVars: document.getElementById('view-vars'),
        viewConsole: document.getElementById('view-console'),
      }).catch((err) => {
        console.error('CrossTab failed to start', err);
        document.getElementById('status').textContent = 'Failed to start: ' + err.message;
      });
    </script>
  </body>
</html>
