<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Lock the sandbox down further than the iframe `sandbox` attribute alone:
      `connect-src 'none'` means a plugin cannot fetch/XHR/WebSocket/sendBeacon on
      its own, so it can't silently phone data home. Its ONLY network path is the
      host-mediated `app.web.get`, which the host gates behind user consent for
      untrusted (externally-loaded) plugins. `script-src` still allows the inline
      runtime below and the plugin's `blob:` module import; everything else is off.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' blob:; connect-src 'none'"
    />
    <title>CrossTab plugin sandbox</title>
  </head>
  <body>
    <!--
      This page is the sandbox a plugin runs in. The engine loads it into an
      <iframe sandbox="allow-scripts">, which forces an opaque origin and a
      separate JS heap — the plugin cannot reach the engine's objects or the
      host DOM. All engine access goes through the `app` proxy below, which turns
      every call into a postMessage to the host broker (see core/plugin-broker.js
      for the matching server side and the full wire protocol).

      The runtime is INLINE on purpose: a sandboxed opaque-origin document cannot
      fetch other same-origin files (they become cross-origin), so it must be
      self-contained. The plugin's own source arrives later via postMessage and
      is imported from a blob: URL (same opaque origin), which is the one way to
      load an ES module into this isolated realm without CORS.
    -->
    <script>
      'use strict';
      (() => {
        const PROTOCOL = 1;
        const parentWin = window.parent;

        /** Pending RPC calls awaiting a result, by id. */
        const pending = new Map();
        let nextCallId = 1;

        /** Plugin-side callbacks the host may invoke, by id. */
        const callbacks = new Map();
        let nextCbId = 1;

        /** The imported plugin module, captured on 'load'. */
        let pluginModule = null;

        /**
         * Chart kinds this plugin supplies: name -> {altNoun, colorLabel, describe, render}.
         *
         * They stay HERE, in the frame. The kind objects hold functions, so they could
         * never be posted to the host — the host holds only their names and calls back
         * in with {t:'chartCall'}. That is also why the drawing stdlib is imported here
         * rather than passed: it is a module full of functions, useless once cloned.
         */
        let chartKinds = null;

        /** The `app` proxy handed to the plugin, built once on 'activate'. */
        let app = null;

        /** Source text of the host's chart-drawing stdlib, sent with 'load'. */
        let stdlibSource = null;
        let std = null; // the general plugin stdlib, imported once at load

        /** Debug logging gate — set to true when the host sends `debug: true`
         * in the activate message. Plugins read `app.debug` to gate their own
         * diagnostic output. */
        let debugEnabled = false;

        // Post a message to the host. Prefer TRANSFERRING any ArrayBuffers (zero-copy):
        // a codec's row batches carry large numeric column buffers, and cloning each
        // churns memory on wide files (the ~7k-column GSS). Transfer neuters the buffer
        // here, safe because everything posted out is handed off, never reused.
        // (Blobs/Files aren't transferable; they clone by reference cheaply.)
        //
        // BUT iOS/Safari WebKit refuses a transfer list across this sandboxed,
        // opaque-origin iframe boundary, throwing "The object can not be cloned." — even
        // though the payload itself IS structured-cloneable; only the transfer is
        // rejected. So try transfer once; on failure, drop to a plain clone for the rest
        // of the session. A serialization throw doesn't detach the buffers, so the retry
        // sends intact data. Chrome keeps zero-copy; Safari falls back to clone (#91).
        let canTransfer = true;
        const post = (m) => {
          const msg = { __crosstab: PROTOCOL, ...m };
          if (canTransfer) {
            try {
              parentWin.postMessage(msg, '*', collectTransferables(msg));
              return;
            } catch (e) {
              canTransfer = false;
              try { console.warn('[plugin-host] transfer refused, cloning instead:', e && e.message); } catch {}
            }
          }
          try {
            parentWin.postMessage(msg, '*');
          } catch (e) {
            const detail = diagnoseClone(msg);
            try { console.error('[plugin-host] clone post failed:', e && e.message, detail); } catch {}
            throw new Error(`plugin→host post failed [${m.method || m.t}]: ${(e && e.message) || e} — ${detail}`);
          }
        };

        /** On a clone failure, localise it: does the WHOLE payload structured-clone
         * (→ the postMessage boundary rejected the message, not its content), and if
         * not, what's the first non-cloneable path + type? (#91 debugging) */
        function diagnoseClone(value) {
          try { structuredClone(value); return 'structuredClone(whole) OK → boundary rejected the message, not its content'; }
          catch { return `non-cloneable at ${findBad(value, 'msg')}`; }
        }
        function findBad(value, path) {
          try { structuredClone(value); return path; } catch { /* this node fails — drill in */ }
          if (value && typeof value === 'object' && !ArrayBuffer.isView(value) && !(value instanceof ArrayBuffer)) {
            const keys = Array.isArray(value) ? value.map((_, i) => i) : Object.keys(value);
            for (const k of keys) { try { structuredClone(value[k]); } catch { return findBad(value[k], `${path}.${k}`); } }
          }
          const ctor = (value && value.constructor && value.constructor.name) || typeof value;
          return `${path} <${ctor}>`;
        }

        /** The distinct ArrayBuffers reachable in `value`, for postMessage's transfer
         * list (deduped — two views can share one buffer). */
        function collectTransferables(value, out = [], seen = new Set()) {
          if (!value || typeof value !== 'object') return out;
          if (value instanceof ArrayBuffer) { if (!seen.has(value)) { seen.add(value); out.push(value); } return out; }
          if (ArrayBuffer.isView(value)) { const b = value.buffer; if (!seen.has(b)) { seen.add(b); out.push(b); } return out; }
          if (value instanceof Blob) return out; // not transferable
          if (Array.isArray(value)) { for (const v of value) collectTransferables(v, out, seen); return out; }
          for (const k of Object.keys(value)) collectTransferables(value[k], out, seen);
          return out;
        }

        // --- RPC client --------------------------------------------------------

        /** Issue a method call to the host and await its result. */
        function call(method, args) {
          const id = nextCallId++;
          return new Promise((resolve, reject) => {
            pending.set(id, { resolve, reject });
            post({ t: 'call', id, method, args: marshalArgs(args) });
          });
        }

        /** Replace functions in args with {__cb:id} markers the host can call. */
        function marshalArgs(value) {
          if (Array.isArray(value)) return value.map(marshalArgs);
          if (typeof value === 'function') {
            const cbId = nextCbId++;
            callbacks.set(cbId, value);
            return { __cb: cbId };
          }
          // Binary payloads (Parquet `Uint8Array`) and File/Blob handles (an
          // upload an importer mounts) are structured-cloneable as-is; don't walk.
          if (value instanceof ArrayBuffer || ArrayBuffer.isView(value) || value instanceof Blob) return value;
          if (value && typeof value === 'object') {
            const out = {};
            for (const k of Object.keys(value)) out[k] = marshalArgs(value[k]);
            return out;
          }
          return value;
        }

        /** Turn a returned {__handle} into a disposer function. */
        function reviveValue(value) {
          if (value && typeof value === 'object' && typeof value.__handle === 'number') {
            return () => call('__dispose', [value.__handle]);
          }
          return value;
        }

        /** Build a namespace whose methods proxy to host RPC calls. */
        function makeNamespace(ns, methods) {
          const obj = {};
          for (const name of methods) {
            obj[name] = (...args) => call(`${ns}.${name}`, args).then(reviveValue);
          }
          return Object.freeze(obj);
        }

        // webr:start — extracted and run by test/webr-run-or-throw.test.mjs.
        /**
         * The `webr` namespace: the host's proxied verbs plus one LOCAL convenience.
         *
         * Eleven plugins carried `async function runR(app, code)` — run it, throw if
         * `result` is null — byte-identical in ten of them. The obvious home was a new
         * `webr.runOrThrow` dispatch verb on the host, and that would have been a bug:
         * the broker REPLACES `dispatch['webr.run']` per invocation to inject the run's
         * bound inputs (see PluginBroker's constructor), so a second host verb calling
         * the WebR manager directly would have run the plugin's R without the variables
         * it was holding — silently, and only for plugins that adopted it.
         *
         * Wrapping the proxy here instead means `runOrThrow` goes out over the SAME
         * `webr.run` message, through the same injection, and costs no new protocol
         * surface. It is also not a candidate for `app.std`: that namespace is pure and
         * synchronous, and an async helper there would break the property that makes it
         * callable without `await`.
         */
        function makeWebr() {
          const ns = makeNamespace('webr', ['run', 'installPackages', 'writeFile', 'readFile', 'mountFile', 'unmount']);
          return Object.freeze({
            ...ns,
            /**
             * Run R and return `result`, throwing when there is none.
             *
             * No `prelude` parameter: builtin-causal's variant took one and composing the
             * string is the caller's business — a second way to spell "put this code
             * first" is not worth a wider verb.
             */
            runOrThrow: async (code, opts) => {
              const { result } = await ns.run(code, opts);
              if (!result) throw new Error('R returned no result');
              return result;
            },
          });
        }
        // webr:end

        /** Listeners for host-pushed `pluginsChanged` notifications. */
        const pluginsChangedListeners = [];

        /** Assemble the `app` object handed to the plugin's activate(). */
        function makeApp(identity) {
          // Declarative plugins don't register anything — the host wires menus,
          // importers and exporters from the manifest. So the `app` surface is
          // only *runtime* verbs: read data, run R, write results, prompt the
          // user, fetch (gated). No menus/importers/exporters/events registration.
          return Object.freeze({
            plugin: Object.freeze(identity),
            // The ONE synchronous, local namespace on `app`. Every other one below is an
            // async postMessage proxy to the host; these are pure functions running in
            // this frame, so making a plugin `await` an escaper would be absurd.
            //
            // Undefined when the source did not arrive — feature-detect (`app.std?.el`).
            // The same namespace is on the frame global as `ctStd`, for module-scope code
            // that cannot see `app`; this is the one callers inside a function should use.
            std,
            data: makeNamespace('data', [
              'getDataFrame', 'getColumns', 'getRows', 'getVariableMeta',
              'getSelectedVariables', 'getRowCount', 'getTransforms', 'getHistory', 'create',
              'setActive', 'maxOctetLengths',
            ]),
            results: makeNamespace('results', [
              'beginAnalysis', 'endAnalysis',
              'appendTable', 'appendPlot', 'appendChart', 'updatePlot', 'appendText', 'appendError',
              'getModel', 'getStyles', 'getPlotPng',
            ]),
            webr: makeWebr(),
            ui: makeNamespace('ui', ['selectVariables', 'selectFromList', 'showForm']),
            web: makeNamespace('web', ['get']),
            // The current user's identity snapshot (#148): { authorId, initials, name,
            // colour } — for stamping authorship on what the plugin creates (CAQDAS
            // code applications → inter-coder reliability). Read-only, self-asserted.
            identity: makeNamespace('identity', ['get']),
            // Workspace plugins (#93, #146) persist opaque state blobs, scoped by
            // the host to this workspace's id. Each blob lives in a named SLOT
            // (plugin-chosen; defaults to '_default'). `list` returns all slots for
            // this workspace. `delete(slotId)` removes a slot.
            // `read(wsId)` / `write(wsId, value, dsId)` (#139) address the plugin's
            // own space from the compute frame (e.g. an exporter reading codings).
            state: makeNamespace('state', ['get', 'set', 'list', 'delete', 'read', 'write']),
            // Codec plugins (#98): streaming format read/write. Live only during a
            // codec invocation; no-op host-side otherwise.
            codec: makeNamespace('codec', ['size', 'sourceFile', 'read', 'begin', 'batch', 'writeChunk', 'loadAsset']),
            // Assets (#139, generalised #152): `load` resolves an `asset:`/`data:` ref to a Blob to
            // render (needs the media CSP, see core/plugin-sandbox.js); `put` streams a
            // host-held File into the store and returns its ref (importer sink). The host
            // owns the bytes; the plugin only ever holds a ref or a Blob.
            assets: makeNamespace('assets', ['load', 'put', 'list']),
            // Item records (#152): fine-grained state with real identity — undoable,
            // mergeable per record, and host-visible enough that a declared asset-ref
            // field can be reference-counted. `state.*` remains for config/atomic blobs.
            items: makeNamespace('items', ['put', 'remove', 'list']),
            // Anchors (#166): a reference to a REGION of something the log addresses —
            // a passage in a cell, a span of a recording, a rectangle on an image.
            // `text(text, start, end)` and `media(selector, assetId)` build one;
            // `resolve(refs, subject)` takes a BATCH and returns where each region is
            // NOW plus how confident that is. Resolution never repairs anything: it is
            // a view, and only a user action writes a correction back.
            anchors: makeNamespace('anchors', ['text', 'media', 'resolve']),
            // Anchored notes (#152). Host-owned: `add({kind, target, ref?}, text)` writes
            // into the project's single memo collection, not a per-plugin one.
            memos: makeNamespace('memos', ['add', 'list', 'setText', 'remove']),
            // What the user has selected, per kind (#153). `get(collection)` returns the
            // selected record id from THIS plugin's collection; `dataset()` the active
            // dataset. Read-only — react to it, don't set it.
            selection: makeNamespace('selection', ['get', 'dataset']),
            // ZIP for archive-format plugins (#139): make(entries)->bytes, read(bytes).
            zip: makeNamespace('zip', ['make', 'read']),
            // On-device speech-to-text and speaker diarization (#139 Phase 2).
            // `run(bytes, opts)` -> {vtt, chunks, turns, seconds}; `options()` -> the
            // languages and model sizes, so a plugin can build its own dialog rather
            // than hardcoding a list that will drift from the model.
            //
            // Core owns this only because a sandbox cannot: an opaque-origin frame
            // cannot create a Worker, and every CSP tier here is `connect-src 'none'`,
            // so it could neither run the model nor fetch it. Progress and cancel are
            // host-rendered — a callback cannot cross this postMessage boundary.
            transcribe: makeNamespace('transcribe', ['run', 'options']),
            // Cross-plugin discovery + invocation (#147): list active plugins and
            // their analysis functions, run another plugin's analysis.
            plugins: Object.freeze({
              list: () => call('plugins.list', []).then(reviveValue),
              onChange: (fn) => { if (typeof fn === 'function') pluginsChangedListeners.push(fn); },
            }),
            run: makeNamespace('run', ['analysis']),
            debug: debugEnabled,
          });
        }

        // --- message handling --------------------------------------------------

        // ---- #154: make silence impossible ---------------------------------
        // The old handshake used deadlines because a guest that died mid-boot said
        // nothing, so the host could only infer failure from elapsed time — which
        // cannot tell a broken frame from a slow one. These handlers turn every death
        // into a MESSAGE, which is what lets the host stop guessing and wait patiently.
        let currentStep = 'booting';
        // Reply to a specific request. rid-keyed so two hooks in flight cannot be
        // confused for each other — the host keeps a Map<rid, deferred>, not one slot.
        const reply = (m, o) => post({ ...o, rid: (m && m.rid) || null });
        const setStep = (step, detail) => {
          currentStep = step;
          post({ t: 'progress', step: step, detail: detail || null });
        };
        window.addEventListener('error', (e) => {
          post({ t: 'crashed', step: currentStep,
                 message: String((e && e.message) || 'uncaught error'),
                 stack: String((e && e.error && e.error.stack) || '') });
        });
        window.addEventListener('unhandledrejection', (e) => {
          const r = e && e.reason;
          post({ t: 'crashed', step: currentStep,
                 message: String((r && r.message) || r || 'unhandled rejection'),
                 stack: String((r && r.stack) || '') });
        });
        // Liveness. The cage DOCUMENT stays responsive while the plugin's own code is
        // busy, so a heartbeat distinguishes "working hard" from "wedged" without any
        // deadline. It is advisory only — a missed beat never fails anything.
        setInterval(() => { post({ t: 'alive', step: currentStep }); }, 2000);

        window.addEventListener('message', async (event) => {
          if (event.source !== parentWin) return; // only trust the host
          const msg = event.data;
          if (!msg || msg.__crosstab !== PROTOCOL) return;

          switch (msg.t) {
            case 'load':
              setStep('loading');
              stdlibSource = msg.stdlib || null;
              // The general stdlib (plugin-stdlib.js), as source. Blobbed and imported
              // HERE rather than handed over as an object, because functions cannot cross
              // postMessage — and in THIS realm, because a blob URL minted in the host's
              // realm is not fetchable from an opaque origin.
              //
              // Not fatal by itself: a plugin that feature-detects (`app.std?.el`) carries
              // on, and refusing to load would turn a missing convenience into a dead
              // feature. But it is no longer only a convenience — see `ctStd` below.
              if (msg.std) {
                const url = URL.createObjectURL(new Blob([msg.std], { type: 'text/javascript' }));
                try { std = await import(url); }
                catch (err) { std = null; console.warn('[plugin-host] stdlib failed to load', err); }
                finally { URL.revokeObjectURL(url); }
              }
              // Also on the frame's global, under a name a plugin can read at MODULE
              // scope — which `app.std` cannot reach, because `app` only exists inside an
              // invoked function.
              //
              // That matters for the reporting formatters (fmtP, rStr, fixed, ci, int,
              // labelOf). They are module-scope helpers in 36 plugins, some of which
              // export nineteen entry points; binding them per entry point would be a
              // hundred insertion sites where a missed one silently keeps a local copy —
              // the exact drift being removed. Read once at the top of a module instead.
              //
              // Assigned BEFORE importPlugin(), because a module body runs on import and
              // reads this during evaluation. Frozen so one plugin cannot reshape the
              // library for the next one in a shared frame.
              //
              // A migrated plugin now FAILS TO LOAD if this is absent, loudly and with
              // this frame named, rather than printing numbers in its own conventions.
              // For output that ends up in a paper that is the better failure: core
              // imports the same file for `el`, so a stdlib that cannot be served means
              // the host did not boot either.
              globalThis.ctStd = std ? Object.freeze({ ...std }) : undefined;

              // The base sheet (tokens, .ct-btn, .ct-split, the small-screen touch rules)
              // goes in HERE, from the frame, rather than waiting for each plugin to call
              // `app.std?.injectStdlibStyles?.(document)` for itself.
              //
              // Why it moved (2026-10-12): builtin-spatial did make that call, and the
              // sheet did not arrive — the owner photographed the result on a phone. The
              // stacked region list sat in half the pane, because `.ct-split` was an
              // unstyled block (which still stacks, by block flow, so the reflow LOOKED
              // like it worked) while the rail kept its 220px desktop width. The root
              // cause was never pinned down: a sandboxed pane is opaque-origin, its
              // console is not reachable from the host, and screenshots of that tab were
              // timing out.
              //
              // This closes it without needing the answer. The symptom requires `std` to
              // have imported — a migrated plugin's module body destructures
              // `globalThis.ctStd` at evaluation time and would throw otherwise, and the
              // pane rendered — so injecting from the same `std`, at the same point, on
              // the frame's own initiative, cannot fail in any scenario consistent with
              // what was observed.
              //
              // It also makes the components real: `.ct-split` and `.ct-btn` can now be
              // used by a third-party plugin that never heard of injectStdlibStyles, and
              // a pane cannot lose its THEME to a forgotten line. Layout still belongs to
              // the plugin's own sheet — see builtin-spatial's `.sp-split` for why.
              //
              // Before importPlugin(), so a module body that measures something at
              // evaluation time sees the styled document. Idempotent: the function
              // returns the existing <style> if one is already there, so a plugin that
              // calls it too (CAQDAS, Spatial) is harmless and stays working.
              try { std?.injectStdlibStyles?.(document); }
              catch (err) { console.warn('[plugin-host] stdlib base sheet not injected', err); }

              await importPlugin(msg.code, msg.rid, msg.modules);
              break;

            case 'chartCall': {
              // The host asks a kind to describe itself for a model, or to render one.
              // Both return plain data (a descriptor spec, or an SVG string), which is
              // the reason the split is two verbs and not "hand us your kind object".
              try {
                const kd = chartKinds && chartKinds[msg.kind];
                if (!kd) throw new Error('no chart kind "' + msg.kind + '"');
                const fn = kd[msg.op];
                if (typeof fn !== 'function') throw new Error('chart kind "' + msg.kind + '" has no ' + msg.op + '()');
                const value = await fn(msg.model, msg.view);
                reply(msg, { t: 'chartResult', ok: true, value });
              } catch (err) {
                reply(msg, { t: 'chartResult', ok: false, error: String((err && err.message) || err) });
              }
              break;
            }

            case 'screen':
              // The host's layout decision, mirrored onto THIS document's root so a
              // plugin's stylesheet can use the same `[data-screen="small"]` selector the
              // host uses. An iframe inherits no CSS from its parent, so without this a
              // workspace pane cannot know, and cannot ask.
              if (msg.mode === 'small' || msg.mode === 'full') {
                document.documentElement.setAttribute('data-screen', msg.mode);
              }
              break;

            case 'activate':
              try {
                // Handshake only: build + keep the app proxy. Declarative plugins
                // do nothing else here — the host reads the manifest and drives
                // them via 'invoke' (run/parse/export named functions).
                if (msg.debug) debugEnabled = true;
                app = makeApp(msg.plugin);
                reply(msg, { t: 'activated', ok: true });
              } catch (err) {
                reply(msg, { t: 'activated', ok: false, error: String(err && err.message || err) });
              }
              break;

            case 'mountWorkspace':
              // Render the plugin's workspace UI into this (now visible) frame's
              // body. The plugin rehydrates from app.state.get() itself.
              try {
                if (!app) app = makeApp(msg.plugin || {});
                const ws = pluginModule && pluginModule.workspace;
                if (!ws || typeof ws.mount !== 'function') {
                  throw new Error('plugin declares a workspace but exports no `workspace.mount(app, root)`');
                }
                await ws.mount(app, document.body, msg.workspace || {});
                reply(msg, { t: 'workspaceMounted', ok: true });
              } catch (err) {
                reply(msg, { t: 'workspaceMounted', ok: false, error: String(err && err.message || err) });
              }
              break;

            case 'datasetChanged':
              // Lifecycle hook: the active dataset switched. If the workspace exports
              // onDatasetChanged, call it so the workspace can re-read state and
              // re-render in place (avoiding a full iframe teardown/remount).
              // If missing, ack ok:false so the host falls back to a full remount.
              try {
                const wsHook = pluginModule && pluginModule.workspace;
                if (wsHook && typeof wsHook.onDatasetChanged === 'function') {
                  if (!app) app = makeApp(msg.plugin || {});
                  if (debugEnabled) console.debug('[plugin-host] datasetChanged → calling hook');
                  await wsHook.onDatasetChanged(app);
                  reply(msg, { t: 'lifecycleAck', hook: 'datasetChanged', ok: true });
                } else {
                  if (debugEnabled) console.debug('[plugin-host] datasetChanged → no hook, ack false');
                  reply(msg, { t: 'lifecycleAck', hook: 'datasetChanged', ok: false });
                }
              } catch (err) {
                if (debugEnabled) console.debug('[plugin-host] datasetChanged → threw:', err && err.message);
                reply(msg, { t: 'lifecycleAck', hook: 'datasetChanged', ok: false, error: String(err && err.message || err) });
              }
              break;

            case 'workspaceRefresh':
              // Lifecycle hook: persisted state changed externally (e.g. an import
              // verb wrote new boundary data). Re-read state and re-render in place.
              // If missing, ack ok:false so the host falls back to a full remount.
              try {
                const wsRefresh = pluginModule && pluginModule.workspace;
                if (wsRefresh && typeof wsRefresh.onRefresh === 'function') {
                  if (!app) app = makeApp(msg.plugin || {});
                  await wsRefresh.onRefresh(app);
                  reply(msg, { t: 'lifecycleAck', hook: 'workspaceRefresh', ok: true });
                } else {
                  reply(msg, { t: 'lifecycleAck', hook: 'workspaceRefresh', ok: false });
                }
              } catch (err) {
                reply(msg, { t: 'lifecycleAck', hook: 'workspaceRefresh', ok: false, error: String(err && err.message || err) });
              }
              break;

            case 'deactivate':
              // Lifecycle hook: the plugin is being deactivated. Flush unsaved state.
              try {
                const wsDeact = pluginModule && pluginModule.workspace;
                if (wsDeact && typeof wsDeact.onDeactivate === 'function') {
                  if (!app) app = makeApp(msg.plugin || {});
                  await wsDeact.onDeactivate(app);
                }
                reply(msg, { t: 'lifecycleAck', hook: 'deactivate', ok: true });
              } catch (err) {
                reply(msg, { t: 'lifecycleAck', hook: 'deactivate', ok: false, error: String(err && err.message || err) });
              }
              break;

            case 'pluginsChanged':
              for (const fn of pluginsChangedListeners) {
                try { fn(); } catch (err) { console.error('[plugin] onChange threw', err); }
              }
              break;

            case 'invoke':
              try {
                if (!app) app = makeApp(msg.plugin || {});
                const fn = pluginModule[msg.fn];
                if (typeof fn !== 'function') throw new Error('plugin has no function "' + msg.fn + '"');
                const value = await fn(app, ...(msg.args || []));
                // Return value is plain data (a dataset, bytes, or nothing) — post
                // it directly; structured clone handles it (or throws if it can't).
                reply(msg, { t: 'invoked', ok: true, value });
              } catch (err) {
                reply(msg, { t: 'invoked', ok: false, error: String(err && err.message || err) });
              }
              break;

            case 'result': {
              const p = pending.get(msg.id);
              if (!p) break;
              pending.delete(msg.id);
              if (msg.ok) p.resolve(msg.value);
              else p.reject(new Error(msg.error));
              break;
            }

            case 'cb': {
              const fn = callbacks.get(msg.cbId);
              if (fn) {
                try {
                  fn(...(msg.args || []));
                } catch (err) {
                  console.error('[plugin] callback threw', err);
                }
              }
              break;
            }

            default:
              break;
          }
        });

        /** Import the plugin source from a blob URL and report its manifest. */
        /**
         * Make a plugin's own modules importable from its entry.
         *
         * Each arrives as SOURCE and is blobbed here, in this realm — a blob minted by the host
         * carries the host's origin and this frame is opaque, which is why the first design for
         * multi-file plugins collapsed. An import map then points each specifier at its blob.
         *
         * The map matches on LITERAL TEXT, not resolved URLs: `blob:` has an opaque path, so
         * `./util.js` cannot be parsed as a URL against a blob base, and the resolver falls back
         * to comparing the raw specifier against the raw key. That is also why several spellings
         * of each name are registered, and why this only works while THIS DOCUMENT is itself
         * blob-served — from a real URL the key would parse and the specifier still would not,
         * so nothing would match. The canary below reports that rather than leaving a future
         * maintainer with silent resolution failures.
         */
        function installModules(modules) {
          const names = Object.keys(modules || {});
          if (!names.length) return;
          if (location.protocol !== 'blob:') {
            // Not fatal — say so and try anyway, because being wrong about this should produce
            // a message, not a mystery.
            try {
              console.warn(
                '[plugin-host] this sandbox document is not blob-served ('
                  + location.protocol + '), so a plugin\'s relative imports may not resolve.',
              );
            } catch {}
          }
          const imports = {};
          for (const name of names) {
            const blobUrl = URL.createObjectURL(new Blob([modules[name]], { type: 'text/javascript' }));
            // aliases:start — this rule also lives in core/plugin-modules.js `moduleKeyAliases`,
            // because an inline sandbox runtime cannot import a module. The markers are a seam
            // for the test that checks the two agree; keep them.
            const stem = name.replace(/\.m?js$/, '');
            const aliases = ['./' + name, name];
            if (stem && stem !== name) aliases.push('./' + stem, stem);
            // aliases:end
            for (const a of aliases) imports[a] = blobUrl;
          }
          const tag = document.createElement('script');
          tag.type = 'importmap';
          tag.textContent = JSON.stringify({ imports });
          // Before any module import in this frame. Production gives every plugin its own
          // frame, so one map per document is all that is ever needed.
          document.head.appendChild(tag);
        }

        async function importPlugin(code, rid, modules) {
          let url;
          try {
            installModules(modules);
            const blob = new Blob([code], { type: 'text/javascript' });
            url = URL.createObjectURL(blob);
            pluginModule = await import(url);
            const m = pluginModule.manifest;
            // A chart plugin is handed the host's drawing stdlib as a plain namespace.
            // The host cannot pass a module across postMessage, so it sends the SOURCE
            // and we import it here, in this realm, next to the plugin that will use it.
            // One copy of the drawing code, owned by core, reaching every chart plugin —
            // including third-party ones, which is the whole point.
            if (m && m.charts && m.charts.via && stdlibSource) {
              const libUrl = URL.createObjectURL(new Blob([stdlibSource], { type: 'text/javascript' }));
              try {
                const lib = await import(libUrl);
                const factory = pluginModule[m.charts.via];
                if (typeof factory !== 'function') {
                  throw new Error('manifest.charts.via names "' + m.charts.via + '", which the plugin does not export');
                }
                chartKinds = await factory(lib);
              } finally {
                URL.revokeObjectURL(libUrl);
              }
            }
            // A plugin declares what it contributes (menu items, importers,
            // exporters) as manifest sections; the named functions they reference
            // are validated per-call at 'invoke'.
            const hasDeclarative =
              m &&
              (Array.isArray(m.menu) ||
                Array.isArray(m.imports) ||
                Array.isArray(m.exports) ||
                Array.isArray(m.outputExports) ||
                Array.isArray(m.workspaces) ||
                Array.isArray(m.codecs) ||
                (m.charts && typeof m.charts.via === 'string'));
            if (!hasDeclarative) {
              throw new Error(
                'plugin must export `manifest` with a declarative section (menu/imports/exports/outputExports/workspaces/codecs/charts)',
              );
            }
            post({ t: 'manifest', ok: true, manifest: pluginModule.manifest, rid: rid || null });
          } catch (err) {
            post({ t: 'manifest', ok: false, error: String(err && err.message || err), rid: rid || null });
          } finally {
            if (url) URL.revokeObjectURL(url);
          }
        }

        // Announce readiness once the runtime is wired up.
        post({ t: 'ready' });
      })();
    </script>
  </body>
</html>
